var PAGES = {
  "fitment": { "title": "Tritorc BTL \u2014 Bolt Tensioner Fitment Checker", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>Tritorc BTL \u2014 Bolt Tensioner Fitment Checker\u003c/title>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n\n:root {\n  --navy:    #eef1f8;\n  --navy2:   #ffffff;\n  --navy3:   #f7f8fc;\n  --steel:   #e6e9f2;\n  --mid:     #2a3145;\n  --accent:  #e3241c;\n  --accent2: #c01d16;\n  --accent-rgb: 227,36,28;\n  --gold:    #a06800;\n  --green:   #0f9a50;\n  --red:     #c01830;\n  --amber:   #a06800;\n  --text:    #141a2e;\n  --muted:   #2a3145;\n  --border:  #e6e9f2;\n  --border2: #d5dae8;\n  --card-bg: #ffffff;\n  --input-bg: #f6f8fc;\n  font-size: 16px;\n}\n\nbody {\n  font-family: 'Barlow Condensed', sans-serif;\n  background: var(--navy);\n  color: var(--text);\n  min-height: 100vh;\n}\n\n/* \u2500\u2500 HEADER \u2500\u2500 */\n.header {\n  background: var(--navy2);\n  border-bottom: 1px solid var(--border);\n  padding: 16px 32px;\n  display: flex; align-items: center; gap: 18px;\n  box-shadow: 0 2px 14px rgba(20,26,46,.06);\n  position: sticky; top: 0; z-index: 50;\n}\n.logo-hex {\n  width: 44px; height: 44px; flex-shrink: 0;\n  background: linear-gradient(135deg, var(--accent2), var(--accent));\n  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);\n  display: flex; align-items: center; justify-content: center;\n}\n.logo-hex svg { width: 22px; height: 22px; fill: white; }\n.header-text h1 {\n  font-family: 'Rajdhani', sans-serif;\n  font-size: 24px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;\n}\n.header-text p { font-size: 13px; color: var(--muted); letter-spacing: 0.04em; margin-top: 2px; }\n.header-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }\n.hdr-badge {\n  background: rgba(var(--accent-rgb),0.1); border: 1px solid var(--border2);\n  border-radius: 3px; padding: 4px 12px;\n  font-family: 'Barlow Condensed', sans-serif; font-size: 13px;\n  letter-spacing: 0.08em; color: var(--accent); text-transform: uppercase;\n}\n\n/* \u2500\u2500 APP NAV (switch between tools) \u2500\u2500 */\n.app-nav { display: flex; gap: 4px; background: rgba(139,92,246,.1); border: 1px solid rgba(139,92,246,.3); border-radius: 24px; padding: 4px; }\n.app-nav a {\n  font-family: 'Rajdhani', sans-serif; font-size: 15px; font-weight: 600;\n  letter-spacing: 0.5px; text-transform: uppercase; color: var(--muted);\n  text-decoration: none; padding: 7px 14px; border-radius: 20px;\n  border: 1px solid transparent; transition: all 0.15s; white-space: nowrap;\n}\n.app-nav a:hover { color: #8b5cf6; border-color: #8b5cf6; }\n.app-nav a.active { background: #8b5cf6; color: #fff; border-color: #8b5cf6; }\n@media (max-width: 700px) { .app-nav a { padding: 7px 10px; font-size: 13px; } }\n@media (max-width: 460px) { .app-nav a span { display: none; } }\n\n/* \u2500\u2500 LAYOUT \u2500\u2500 */\n.main { max-width: 1120px; margin: 0 auto; padding: 28px 20px 60px; }\n\n/* \u2500\u2500 SECTION LABELS \u2500\u2500 */\n.sec-label {\n  font-family: 'Barlow Condensed', sans-serif;\n  font-size: 13px; font-weight: 600; letter-spacing: 0.18em;\n  text-transform: uppercase; color: var(--accent);\n  margin-bottom: 12px; display: flex; align-items: center; gap: 10px;\n}\n.sec-label::after { content:''; flex:1; height:1px; background: var(--border); }\n\n/* \u2500\u2500 REFERENCE GUIDE PANEL \u2500\u2500 */\n.ref-panel {\n  background: var(--card-bg);\n  border: 1px solid var(--border);\n  border-left: 3px solid var(--accent);\n  border-radius: 14px;\n  margin-bottom: 20px;\n  overflow: hidden;\n}\n.ref-panel-header {\n  display: flex; align-items: center; justify-content: space-between;\n  padding: 12px 18px; cursor: pointer;\n  background: rgba(var(--accent-rgb),0.05);\n  border-bottom: 1px solid var(--border);\n  user-select: none;\n}\n.ref-panel-header:hover { background: rgba(var(--accent-rgb),0.09); }\n.ref-panel-title {\n  font-family: 'Barlow Condensed', sans-serif; font-size: 14px;\n  font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;\n  color: var(--accent); display: flex; align-items: center; gap: 10px;\n}\n.ref-chevron { font-size: 13px; color: var(--muted); transition: transform 0.25s; }\n.ref-chevron.open { transform: rotate(180deg); }\n.ref-body { display: none; padding: 0; }\n.ref-body.open { display: block; }\n\n.ref-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }\n.ref-img-col {\n  border-right: 1px solid var(--border);\n  padding: 18px; display: flex; align-items: flex-start; justify-content: center;\n}\n.ref-img-col img { max-width: 100%; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.3); }\n.ref-text-col { padding: 20px 22px; }\n.ref-text-col h3 {\n  font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700;\n  letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent);\n  margin-bottom: 14px;\n}\n\n.dim-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }\n.dim-item {\n  background: var(--input-bg); border: 1px solid var(--border);\n  border-radius: 4px; padding: 8px 11px;\n}\n.dim-letter {\n  font-family: 'Barlow Condensed', sans-serif; font-size: 19px; font-weight: 700;\n  color: var(--accent); line-height: 1;\n}\n.dim-name { font-size: 12px; color: var(--text); font-weight: 500; margin-top: 2px; }\n.dim-desc { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.4; }\n\n.rule-list { list-style: none; }\n.rule-list li {\n  display: flex; gap: 10px; align-items: flex-start;\n  padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; line-height: 1.5;\n}\n.rule-list li:last-child { border-bottom: none; }\n.rule-num {\n  flex-shrink: 0; width: 22px; height: 22px;\n  background: var(--accent2); border-radius: 50%;\n  display: flex; align-items: center; justify-content: center;\n  font-family: 'Barlow Condensed', sans-serif; font-size: 13px;\n  font-weight: 700; color: white;\n}\n.rule-text { color: var(--muted); }\n.rule-text strong { color: var(--text); font-family: monospace; font-size: 12px; }\n\n/* \u2500\u2500 CARDS \u2500\u2500 */\n.card {\n  background: var(--card-bg);\n  border: 1px solid var(--border);\n  border-radius: 14px; padding: 20px 22px; margin-bottom: 18px;\n}\n\n/* \u2500\u2500 TABS \u2500\u2500 */\n.tabs { display: flex; gap: 0; margin-bottom: 18px; }\n.tab {\n  flex: 1; padding: 11px 10px; text-align: center;\n  background: var(--input-bg); border: 1px solid var(--border);\n  cursor: pointer; font-family: 'Rajdhani', sans-serif;\n  font-size: 15px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase;\n  color: var(--muted); transition: all 0.15s;\n}\n.tab:first-child { border-radius: 4px 0 0 4px; }\n.tab:last-child  { border-radius: 0 4px 4px 0; }\n.tab:not(:first-child) { border-left: none; }\n.tab.active { background: var(--accent2); border-color: var(--accent); color: #fff; }\n.tab-panel { display: none; }\n.tab-panel.active { display: block; }\n\n/* \u2500\u2500 GRIDS \u2500\u2500 */\n.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }\n.grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 13px; }\n.grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 13px; }\n\n.field { display: flex; flex-direction: column; gap: 5px; }\n.field label {\n  font-size: 13px; font-weight: 500; letter-spacing: 0.05em;\n  text-transform: uppercase; color: var(--muted);\n  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;\n}\n.unit { color: var(--accent); font-family: monospace; font-size: 11px; }\n.auto-tag { color: var(--green); font-size: 11px; }\n.field input, .field select {\n  background: var(--input-bg); border: 1px solid var(--border);\n  border-radius: 4px; color: var(--text);\n  padding: 9px 11px; font-family: monospace;\n  font-size: 14px; transition: border-color 0.15s, background-color 0.15s; outline: none;\n  width: 100%;\n}\n.field input:focus, .field select:focus { border-color: var(--accent); }\n.field select option { background: var(--navy2); color: var(--text); }\n.field input[readonly] { opacity: 0.7; cursor: default; }\n\n/* HIGHLIGHTED INPUT FIELDS */\n.field input:not([readonly]), .field select {\n  background-color: #fbeceb; border: 1.5px solid var(--accent); font-weight: 600;\n}\n.field input:not([readonly]):hover, .field select:hover { background-color: #f6dad8; }\n.field input:not([readonly]):focus, .field select:focus { background-color: #fff; box-shadow: 0 0 0 3px rgba(227,36,28,.25); }\n\n.field-hint { font-size: 11px; color: var(--muted); margin-top: 2px; }\n\n/* \u2500\u2500 BTN \u2500\u2500 */\n.btn-run {\n  width: 100%; padding: 14px;\n  background: linear-gradient(135deg, var(--accent), var(--accent2));\n  border: none; border-radius: 10px; color: #fff;\n  font-family: 'Rajdhani', sans-serif;\n  font-size: 18px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;\n  cursor: pointer; transition: all 0.15s; margin-top: 10px;\n  box-shadow: 0 6px 18px rgba(var(--accent-rgb),0.35);\n}\n.btn-run:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(var(--accent-rgb),0.45); }\n\n/* \u2500\u2500 DIVIDER \u2500\u2500 */\n.divider { border: none; border-top: 1px solid var(--border); margin: 18px 0; }\n\n/* \u2500\u2500 RESULTS \u2500\u2500 */\n#results { display: none; }\n.result-header { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }\n.model-name { font-family: 'Rajdhani', sans-serif; font-size: 30px; font-weight: 700; color: var(--accent); }\n.model-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }\n.verdict-badge {\n  font-family: 'Barlow Condensed', sans-serif;\n  font-size: 15px; font-weight: 700; letter-spacing: 0.1em;\n  padding: 8px 18px; border-radius: 4px; text-transform: uppercase;\n}\n.verdict-badge.pass  { background: rgba(24,212,114,0.12); border: 1px solid var(--green); color: var(--green); }\n.verdict-badge.fail  { background: rgba(240,48,80,0.12);  border: 1px solid var(--red);   color: var(--red); }\n.verdict-badge.warn  { background: rgba(244,163,0,0.12);  border: 1px solid var(--amber); color: var(--amber); }\n\n/* \u2500\u2500 CHECK TABLE \u2500\u2500 */\n.check-table { width: 100%; border-collapse: collapse; font-size: 13px; }\n.check-table th {\n  padding: 8px 12px; text-align: left;\n  font-family: 'Barlow Condensed', sans-serif;\n  font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;\n  color: var(--muted); border-bottom: 1px solid var(--border2);\n}\n.check-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }\n.check-table tr:last-child td { border-bottom: none; }\n.check-table .param { color: var(--text); font-weight: 500; font-size: 13px; }\n.check-table .sub  { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.4; }\n.check-table .vals { font-family: monospace; color: var(--muted); font-size: 12px; }\n.check-table .margin { font-family: monospace; font-size: 12px; }\n\n.status-pill {\n  display: inline-flex; align-items: center; gap: 5px;\n  padding: 3px 10px; border-radius: 3px;\n  font-family: 'Barlow Condensed', sans-serif;\n  font-size: 12px; font-weight: 700; letter-spacing: 0.06em; white-space: nowrap;\n}\n.status-pill.pass  { background: rgba(24,212,114,0.12); color: var(--green); }\n.status-pill.fail  { background: rgba(240,48,80,0.12);  color: var(--red);   }\n.status-pill.warn  { background: rgba(244,163,0,0.12);  color: var(--amber); }\n.status-pill::before { content:''; width:6px; height:6px; border-radius:50%; background:currentColor; }\n\n/* \u2500\u2500 MODEL GRID \u2500\u2500 */\n.model-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; margin-top: 12px; }\n.model-card {\n  border: 1px solid var(--border); border-radius: 5px; padding: 12px;\n  background: var(--input-bg); text-align: center; transition: all 0.15s;\n}\n.model-card.best    { border: 2px solid var(--green); background: rgba(24,212,114,0.06); }\n.model-card.partial { border: 1px solid var(--amber); background: rgba(244,163,0,0.06); }\n.model-card.bad     { opacity: 0.45; }\n.mc-name { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700; color: var(--accent); }\n.mc-bolt { font-size: 11px; color: var(--muted); margin-top: 2px; }\n.mc-badge { margin-top: 5px; font-size: 11px; font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.05em; text-transform: uppercase; }\n\n/* \u2500\u2500 SPEC GRID \u2500\u2500 */\n.spec-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 8px; margin-top: 12px; }\n.spec-item { background: var(--input-bg); border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; }\n.sl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }\n.sv { font-family: monospace; font-size: 14px; font-weight: 500; margin-top: 4px; color: var(--text); }\n\n/* \u2500\u2500 NOTES \u2500\u2500 */\n.note-box {\n  border-left: 3px solid var(--accent); background: rgba(var(--accent-rgb),0.05);\n  padding: 10px 14px; border-radius: 0 4px 4px 0;\n  font-size: 13px; color: var(--muted); margin-top: 10px; line-height: 1.6;\n}\n.note-box.warn { border-color: var(--amber); background: rgba(244,163,0,0.05); color: #c89040; }\n.note-box.fail { border-color: var(--red);   background: rgba(240,48,80,0.05);  color: #e07070; }\n.note-box.pass { border-color: var(--green);  background: rgba(24,212,114,0.05); color: #40c880; }\n\n/* \u2500\u2500 TORQUE BOX \u2500\u2500 */\n.torque-box {\n  margin-top: 10px; background: var(--input-bg); border: 1px solid var(--border);\n  border-radius: 4px; padding: 10px 14px;\n  font-family: monospace; font-size: 13px; color: var(--text);\n}\n.torque-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 4px; }\n\n/* \u2500\u2500 EXPORT BTN \u2500\u2500 */\n.btn-export {\n  padding: 8px 18px; border: 1px solid var(--border2); border-radius: 4px;\n  background: transparent; color: var(--accent);\n  font-family: 'Barlow Condensed', sans-serif; font-size: 13px;\n  letter-spacing: 0.06em; text-transform: uppercase;\n  cursor: pointer; transition: all 0.15s; margin-left: auto;\n}\n.btn-export:hover { background: rgba(var(--accent-rgb),0.1); }\n\n/* \u2500\u2500 INFO BANNER \u2500\u2500 */\n.info-banner {\n  background: rgba(var(--accent-rgb),0.06); border: 1px solid var(--border);\n  border-left: 3px solid var(--accent2); border-radius: 0 4px 4px 0;\n  padding: 12px 16px; margin-bottom: 18px; font-size: 13px; color: var(--muted); line-height: 1.7;\n  display: flex; align-items: flex-start; gap: 10px;\n}\n.info-banner svg { flex-shrink: 0; margin-top: 2px; color: var(--accent2); }\n.info-banner ul { list-style: none; margin-top: 2px; }\n.info-banner li { padding: 1px 0; }\n\n/* \u2500\u2500 PIPE OD HINT \u2500\u2500 */\n.inline-hint {\n  background: rgba(244,163,0,0.07); border: 1px solid rgba(244,163,0,0.25);\n  border-radius: 4px; padding: 8px 12px; margin-top: 10px;\n  font-size: 12px; color: #c89040; line-height: 1.5;\n}\n\n/* \u2500\u2500 HOW-TO / INSTRUCTIONS STEPS \u2500\u2500 */\n.howto-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 20px; }\n.howto-item {\n  background: var(--card-bg); border: 1px solid var(--border);\n  border-radius: 6px; padding: 14px 16px; position: relative;\n}\n.howto-num {\n  width: 24px; height: 24px; border-radius: 50%;\n  background: var(--accent2); color: #fff;\n  display: flex; align-items: center; justify-content: center;\n  font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700;\n  margin-bottom: 8px;\n}\n.howto-title {\n  font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700;\n  letter-spacing: 0.03em; color: var(--text); margin-bottom: 4px;\n}\n.howto-text { font-size: 12px; color: var(--muted); line-height: 1.5; }\n.howto-item::after {\n  content: '\u2192'; position: absolute; right: -18px; top: 50%; transform: translateY(-50%);\n  color: var(--border2); font-size: 16px;\n}\n.howto-item:last-child::after { content: none; }\n\n/* \u2500\u2500 REQUIRED FIELD MARK \u2500\u2500 */\n.req-mark { color: var(--accent); font-weight: 700; font-size: 13px; }\n.field input.input-required {\n  border-left: 3px solid var(--accent2);\n  background: rgba(var(--accent-rgb),0.045);\n}\n\n/* \u2500\u2500 VALIDATION ERROR STATE \u2500\u2500 */\n.field input.input-error, .field select.input-error {\n  border-color: var(--red) !important;\n  border-left: 3px solid var(--red) !important;\n  box-shadow: 0 0 0 2px rgba(192,24,48,0.15);\n  background: rgba(192,24,48,0.05);\n}\n.validation-msg { display: none; }\n\n/* \u2500\u2500 RESPONSIVE \u2500\u2500 */\n@media (max-width: 760px) {\n  .grid-3, .grid-4, .spec-grid { grid-template-columns: 1fr 1fr; }\n  .grid-2 { grid-template-columns: 1fr; }\n  .model-grid { grid-template-columns: repeat(2,1fr); }\n  .ref-layout { grid-template-columns: 1fr; }\n  .ref-img-col { border-right: none; border-bottom: 1px solid var(--border); }\n  .dim-grid { grid-template-columns: 1fr; }\n  .header { padding: 12px 16px; flex-wrap: wrap; }\n  .howto-grid { grid-template-columns: 1fr 1fr; }\n  .howto-item::after { content: none; }\n}\n@media print {\n  .btn-run, .btn-export, .tabs, .ref-panel-header { display: none !important; }\n  #results { display: block !important; }\n  .ref-body { display: block !important; }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"header\">\n  \u003cdiv class=\"logo-hex\">\n    \u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z\"/>\u003c/svg>\n  \u003c/div>\n  \u003cdiv class=\"header-text\">\n    \u003ch1>Tritorc BTL Series \u2014 Fitment Checker\u003c/h1>\n    \u003cp>Top-side hydraulic bolt tensioner \u00b7 clearance &amp; interference analysis\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"header-right\">\n    \u003cdiv class=\"app-nav\">\n      \u003ca href=\"Tritork_BTL_Fitment_Checker_R3.html\" class=\"active\">\ud83d\udcd0 \u003cspan>Fitment Checker\u003c/span>\u003c/a>\n      \u003ca href=\"Tritorc_Bolt_Torquing_Calculator.html\">\ud83d\udd29 \u003cspan>Torque Calculator\u003c/span>\u003c/a>\n      \u003ca href=\"bolt_tensioning_calculator.html\">\ud83d\udccf \u003cspan>Tensioning Calculator\u003c/span>\u003c/a>\n    \u003c/div>\n    \u003cdiv class=\"hdr-badge\">BTL Series v3.0\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"main\">\n\n\u003c!-- \u2550\u2550 HOW TO USE \u2550\u2550 -->\n\u003cdiv class=\"sec-label\">How to use this tool\u003c/div>\n\u003cdiv class=\"howto-grid\">\n  \u003cdiv class=\"howto-item\">\n    \u003cdiv class=\"howto-num\">1\u003c/div>\n    \u003cdiv class=\"howto-title\">Select your flange\u003c/div>\n    \u003cdiv class=\"howto-text\">Choose \u003cstrong>Standard\u003c/strong> to auto-fill from ASME B16.5 / API 6A tables, or \u003cstrong>Non-Standard\u003c/strong> to type in measured / drawing dimensions.\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"howto-item\">\n    \u003cdiv class=\"howto-num\">2\u003c/div>\n    \u003cdiv class=\"howto-title\">Check bolt &amp; nut details\u003c/div>\n    \u003cdiv class=\"howto-text\">Bolt size, nut AF/AC and height auto-fill from catalogue tables \u2014 edit them if your site measurements differ.\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"howto-item\">\n    \u003cdiv class=\"howto-num\">3\u003c/div>\n    \u003cdiv class=\"howto-title\">Set grade &amp; lubrication\u003c/div>\n    \u003cdiv class=\"howto-text\">Pick the bolt grade and lubrication condition to get the correct torque and tension spec.\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"howto-item\">\n    \u003cdiv class=\"howto-num\">4\u003c/div>\n    \u003cdiv class=\"howto-title\">Run the check\u003c/div>\n    \u003cdiv class=\"howto-text\">Click \u003cstrong>Run Fitment Check\u003c/strong> \u2014 the tool compares all BTL models and recommends the best fit with pass/fail margins.\u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003cdiv class=\"info-banner\">\n  \u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\"/>\u003cpath d=\"M12 16v-4M12 8h.01\"/>\u003c/svg>\n  \u003cul>\n    \u003cli>Fields marked \u003cspan class=\"req-mark\">*\u003c/span> are required to run the check.\u003c/li>\n    \u003cli>Fields labelled \u003cspan class=\"auto-tag\">auto\u003c/span> are calculated for you \u2014 overwrite them any time with your own measured values.\u003c/li>\n    \u003cli>Unsure what a dimension means? Expand the reference diagram below.\u003c/li>\n  \u003c/ul>\n\u003c/div>\n\n\u003c!-- \u2550\u2550 REFERENCE GUIDE \u2550\u2550 -->\n\u003cdiv class=\"sec-label\">Dimension reference guide\u003c/div>\n\u003cdiv class=\"ref-panel\">\n  \u003cdiv class=\"ref-panel-header\" onclick=\"toggleRef()\">\n    \u003cdiv class=\"ref-panel-title\">\n      \u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\"/>\u003cpath d=\"M12 16v-4M12 8h.01\"/>\u003c/svg>\n      BTL Fitment Diagram &amp; Measurement Guide \u2014 click to expand\n    \u003c/div>\n    \u003cspan class=\"ref-chevron\" id=\"refChevron\">\u25bc\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"ref-body\" id=\"refBody\">\n    \u003cdiv class=\"ref-layout\">\n      \u003cdiv class=\"ref-img-col\">\n        \u003cimg id=\"btlRefImg\" src=\"\" alt=\"BTL Series Fitment Reference Diagram \u2014 shows flange face-on view with PCD, centre-to-centre bolt distance, distance between pipe and bolt, obstruction clearance, stud protrusion, nut height, and the BTL tool dimension envelope A B C D E F\">\n      \u003c/div>\n      \u003cdiv class=\"ref-text-col\">\n        \u003ch3>BTL Tool Dimensions\u003c/h3>\n        \u003cdiv class=\"dim-grid\">\n          \u003cdiv class=\"dim-item\">\u003cdiv class=\"dim-letter\">A\u003c/div>\u003cdiv class=\"dim-name\">Bridge OD\u003c/div>\u003cdiv class=\"dim-desc\">Outer diameter of the BTL tool body\u003c/div>\u003c/div>\n          \u003cdiv class=\"dim-item\">\u003cdiv class=\"dim-letter\">B\u003c/div>\u003cdiv class=\"dim-name\">Inner Bore\u003c/div>\u003cdiv class=\"dim-desc\">Inner bore through which the nut and stud pass\u003c/div>\u003c/div>\n          \u003cdiv class=\"dim-item\">\u003cdiv class=\"dim-letter\">C\u003c/div>\u003cdiv class=\"dim-name\">Overall Height\u003c/div>\u003cdiv class=\"dim-desc\">Total height of the assembled tensioner\u003c/div>\u003c/div>\n          \u003cdiv class=\"dim-item\">\u003cdiv class=\"dim-letter\">D\u003c/div>\u003cdiv class=\"dim-name\">Bridge Height\u003c/div>\u003cdiv class=\"dim-desc\">Height of the bridge saddle that sits over the nut\u003c/div>\u003c/div>\n          \u003cdiv class=\"dim-item\">\u003cdiv class=\"dim-letter\">E\u003c/div>\u003cdiv class=\"dim-name\">Puller Engagement\u003c/div>\u003cdiv class=\"dim-desc\">Length of thread engagement in the puller\u003c/div>\u003c/div>\n          \u003cdiv class=\"dim-item\">\u003cdiv class=\"dim-letter\">F\u003c/div>\u003cdiv class=\"dim-name\">Stud Engagement Range\u003c/div>\u003cdiv class=\"dim-desc\">Min\u2013Max stud protrusion above the nut for the puller to grip\u003c/div>\u003c/div>\n        \u003c/div>\n\n        \u003ch3 style=\"margin-top:4px\">Flange / Site Measurements\u003c/h3>\n        \u003cdiv class=\"dim-grid\">\n          \u003cdiv class=\"dim-item\">\u003cdiv class=\"dim-letter\" style=\"font-size:13px;color:var(--gold)\">PCD\u003c/div>\u003cdiv class=\"dim-name\">Pitch Circle Diameter\u003c/div>\u003cdiv class=\"dim-desc\">Diameter of the bolt-hole circle on the flange face\u003c/div>\u003c/div>\n          \u003cdiv class=\"dim-item\">\u003cdiv class=\"dim-letter\" style=\"font-size:13px;color:var(--gold)\">C\u2013C\u003c/div>\u003cdiv class=\"dim-name\">Centre-to-Centre\u003c/div>\u003cdiv class=\"dim-desc\">Arc chord distance between adjacent bolt centres\u003c/div>\u003c/div>\n          \u003cdiv class=\"dim-item\">\u003cdiv class=\"dim-letter\" style=\"font-size:13px;color:var(--gold)\">B2P\u003c/div>\u003cdiv class=\"dim-name\">Bolt-to-Pipe\u003c/div>\u003cdiv class=\"dim-desc\">Radial distance from bolt centre to pipe OD surface\u003c/div>\u003c/div>\n          \u003cdiv class=\"dim-item\">\u003cdiv class=\"dim-letter\" style=\"font-size:13px;color:var(--gold)\">SP\u003c/div>\u003cdiv class=\"dim-name\">Stud Protrusion\u003c/div>\u003cdiv class=\"dim-desc\">Length of stud extending above the nut face\u003c/div>\u003c/div>\n        \u003c/div>\n\n        \u003ch3 style=\"margin-top:4px\">3 Fitment Rules (from catalogue)\u003c/h3>\n        \u003cul class=\"rule-list\">\n          \u003cli>\n            \u003cdiv class=\"rule-num\">1\u003c/div>\n            \u003cdiv class=\"rule-text\">\u003cstrong>Distance between Pipe and Bolt &gt; A/2\u003c/strong>\u003cbr>The tool radius must fit in the gap between the pipe body and the bolt. \u003cem>Pipe-to-bolt clearance = (PCD \u2212 Pipe OD) / 2\u003c/em>\u003c/div>\n          \u003c/li>\n          \u003cli>\n            \u003cdiv class=\"rule-num\">2\u003c/div>\n            \u003cdiv class=\"rule-text\">\u003cstrong>Nut Height + Stud Protrusion + Clearance over stud &gt; D + 12.75 mm\u003c/strong>\u003cbr>The bridge height D plus a minimum 12.75 mm working margin must fit within the available stack height.\u003c/div>\n          \u003c/li>\n          \u003cli>\n            \u003cdiv class=\"rule-num\">3\u003c/div>\n            \u003cdiv class=\"rule-text\">\u003cstrong>Centre-to-Centre bolt distance \u2265 B (inner bore)\u003c/strong>\u003cbr>The C-to-C distance between two adjacent bolts must be equal to or greater than the tool inner bore diameter B. This ensures the tool body can sit over a stud without the bore contacting the neighbouring bolt.\u003c/div>\n          \u003c/li>\n        \u003c/ul>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- \u2550\u2550 INPUTS \u2550\u2550 -->\n\u003cdiv class=\"sec-label\">Flange inputs\u003c/div>\n\n\u003cdiv class=\"tabs\">\n  \u003cdiv class=\"tab active\" onclick=\"switchTab('std')\">Standard Flange (ASME B16.5 / API 6A lookup)\u003c/div>\n  \u003cdiv class=\"tab\" onclick=\"switchTab('nonstd')\">Non-Standard / Custom Flange\u003c/div>\n\u003c/div>\n\n\u003c!-- Standard flange tab -->\n\u003cdiv class=\"tab-panel active\" id=\"tab-std\">\n  \u003cdiv class=\"card\">\n    \u003cdiv style=\"font-size:11px;color:var(--muted);margin-bottom:12px\">Select standard and pressure class \u2014 PCD, bolt count and bolt size are auto-populated from catalogue data.\u003c/div>\n    \u003cdiv class=\"grid-3\" style=\"margin-bottom:12px\">\n      \u003cdiv class=\"field\">\n        \u003clabel>Standard\u003c/label>\n        \u003cselect id=\"flange_std\" onchange=\"populateFlange()\">\n          \u003coption value=\"ASME\">ASME B16.5 (inch sizes, metric bolts)\u003c/option>\n          \u003coption value=\"API\">API 6A (psi ratings)\u003c/option>\n        \u003c/select>\n      \u003c/div>\n      \u003cdiv class=\"field\">\n        \u003clabel>Flange size\u003c/label>\n        \u003cselect id=\"flange_size\" onchange=\"populateFlange()\">\u003c/select>\n      \u003c/div>\n      \u003cdiv class=\"field\">\n        \u003clabel>Pressure class\u003c/label>\n        \u003cselect id=\"flange_class\" onchange=\"populateFlange()\">\u003c/select>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"grid-4\" id=\"auto_dims\">\n      \u003cdiv class=\"field\">\u003clabel>PCD \u003cspan class=\"unit\">mm\u003c/span>\u003c/label>\u003cinput type=\"number\" id=\"s_pcd\" readonly>\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel>No. of bolts\u003c/label>\u003cinput type=\"number\" id=\"s_nbolts\" readonly>\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel>Bolt-to-bolt c-c \u003cspan class=\"unit\">mm\u003c/span>\u003c/label>\u003cinput type=\"number\" id=\"s_b2b\" readonly>\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel>Bolt size (auto)\u003c/label>\u003cinput type=\"text\" id=\"s_bsize\" readonly>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"field\" style=\"margin-top:12px\">\n      \u003clabel>Pipe OD (bore / barrel OD) \u003cspan class=\"unit\">mm\u003c/span>\u003c/label>\n      \u003cinput type=\"number\" id=\"s_pipe_od\" placeholder=\"Enter pipe outside diameter \u2014 required for pipe-to-bolt check\" oninput=\"calcStdB2Body()\">\n    \u003c/div>\n    \u003cdiv class=\"inline-hint\" id=\"pipe_od_hint\">\n      \u26a0 Pipe OD is needed for Rule 1 (bolt-to-pipe clearance). If left blank, the check will be skipped. Typical values: 2\"=60mm, 4\"=114mm, 6\"=168mm, 8\"=219mm, 10\"=273mm, 12\"=324mm, 16\"=406mm, 20\"=508mm, 24\"=610mm.\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- Non-standard flange tab -->\n\u003cdiv class=\"tab-panel\" id=\"tab-nonstd\">\n  \u003cdiv class=\"card\">\n    \u003cdiv style=\"font-size:11px;color:var(--muted);margin-bottom:12px\">Enter measured or drawing dimensions. Bolt-to-bolt c-c and bolt-to-pipe are computed automatically from PCD.\u003c/div>\n    \u003cdiv class=\"grid-3\" style=\"margin-bottom:12px\">\n      \u003cdiv class=\"field\">\u003clabel>PCD \u2014 pitch circle diameter \u003cspan class=\"unit\">mm\u003c/span> \u003cspan class=\"req-mark\">*\u003c/span>\u003c/label>\u003cinput class=\"input-required\" type=\"number\" id=\"ns_pcd\" placeholder=\"e.g. 368\" oninput=\"autoCalcNonStd()\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel>Number of bolts \u003cspan class=\"req-mark\">*\u003c/span>\u003c/label>\u003cinput class=\"input-required\" type=\"number\" id=\"ns_nbolts\" placeholder=\"e.g. 16\" oninput=\"autoCalcNonStd()\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel>Bolt-to-bolt c-c \u003cspan class=\"unit\">mm\u003c/span> \u003cspan class=\"auto-tag\">auto\u003c/span>\u003c/label>\u003cinput type=\"number\" id=\"ns_b2b\" placeholder=\"auto from PCD \u00f7 n\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"grid-3\">\n      \u003cdiv class=\"field\">\u003clabel>Pipe / bore OD \u003cspan class=\"unit\">mm\u003c/span>\u003c/label>\u003cinput type=\"number\" id=\"ns_pipe_od\" placeholder=\"e.g. 219\" oninput=\"autoCalcNonStd()\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel>Bolt-to-pipe \u003cspan class=\"unit\">mm\u003c/span> \u003cspan class=\"auto-tag\">auto\u003c/span>\u003c/label>\u003cinput type=\"number\" id=\"ns_b2body\" placeholder=\"auto = (PCD \u2212 Pipe OD) / 2\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel>Flange OD \u003cspan class=\"unit\">mm\u003c/span>\u003c/label>\u003cinput type=\"number\" id=\"ns_flange_od\" placeholder=\"e.g. 470 (optional)\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- \u2550\u2550 BOLT / STUD DETAILS \u2550\u2550 -->\n\u003cdiv class=\"sec-label\" style=\"margin-top:6px\">Bolt / stud details\u003c/div>\n\u003cdiv class=\"card\">\n  \u003cdiv style=\"font-size:11px;color:var(--muted);margin-bottom:12px\">Nut across-flat (AF) and height are auto-filled from ISO 4032 / ASME B18.2.2 tables. Across-corner (AC) = AF \u00d7 1.1547 (hexagon geometry).\u003c/div>\n  \u003cdiv class=\"grid-3\">\n    \u003cdiv class=\"field\">\n      \u003clabel>Bolt / stud size\u003c/label>\n      \u003cselect id=\"bolt_size\" onchange=\"autoBoltDims()\">\n        \u003coption>M16\u003c/option>\u003coption>M18\u003c/option>\u003coption>M20\u003c/option>\u003coption>M22\u003c/option>\n        \u003coption>M24\u003c/option>\u003coption>M27\u003c/option>\u003coption>M30\u003c/option>\u003coption>M33\u003c/option>\n        \u003coption>M36\u003c/option>\u003coption>M39\u003c/option>\u003coption>M42\u003c/option>\u003coption>M45\u003c/option>\n        \u003coption>M48\u003c/option>\u003coption selected>M52\u003c/option>\u003coption>M56\u003c/option>\u003coption>M60\u003c/option>\n        \u003coption>M64\u003c/option>\u003coption>M68\u003c/option>\u003coption>M72\u003c/option>\u003coption>M76\u003c/option>\n        \u003coption>M80\u003c/option>\u003coption>M85\u003c/option>\u003coption>M90\u003c/option>\u003coption>M95\u003c/option>\n        \u003coption>M100\u003c/option>\u003coption>M105\u003c/option>\u003coption>M110\u003c/option>\u003coption>M120\u003c/option>\n        \u003coption>M125\u003c/option>\u003coption>M130\u003c/option>\u003coption>M140\u003c/option>\u003coption>M150\u003c/option>\n        \u003coption>Custom\u003c/option>\n      \u003c/select>\n    \u003c/div>\n    \u003cdiv class=\"field\">\n      \u003clabel>Nut across-flats AF \u003cspan class=\"unit\">mm\u003c/span> \u003cspan class=\"auto-tag\">auto\u003c/span>\u003c/label>\n      \u003cinput type=\"number\" id=\"nut_af\" placeholder=\"e.g. 80\" oninput=\"onAfChange()\">\n    \u003c/div>\n    \u003cdiv class=\"field\">\n      \u003clabel>Nut across-corners AC \u003cspan class=\"unit\">mm\u003c/span> \u003cspan style=\"color:var(--accent);font-size:10px\">= AF \u00d7 1.1547\u003c/span>\u003c/label>\n      \u003cinput type=\"number\" id=\"nut_ac\" placeholder=\"auto\">\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"grid-3\" style=\"margin-top:12px\">\n    \u003cdiv class=\"field\">\n      \u003clabel>Nut height \u003cspan class=\"unit\">mm\u003c/span> \u003cspan class=\"auto-tag\">auto\u003c/span>\u003c/label>\n      \u003cinput type=\"number\" id=\"nut_h\" placeholder=\"e.g. 48\">\n    \u003c/div>\n    \u003cdiv class=\"field\">\n      \u003clabel>Stud protrusion above nut \u003cspan class=\"unit\">mm\u003c/span>\u003c/label>\n      \u003cinput type=\"number\" id=\"stud_prot\" placeholder=\"e.g. 40\u201360\">\n      \u003cdiv class=\"field-hint\">Measured from nut top face to stud tip\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"field\">\n      \u003clabel>Clearance over stud to obstruction \u003cspan class=\"unit\">mm\u003c/span>\u003c/label>\n      \u003cinput type=\"number\" id=\"clr_over_stud\" placeholder=\"Leave blank if open / unobstructed\">\n      \u003cdiv class=\"field-hint\">e.g. distance to pipe rack, adjacent pipe, or structural beam\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- \u2550\u2550 BOLT GRADE \u2550\u2550 -->\n\u003cdiv class=\"sec-label\" style=\"margin-top:6px\">Bolt grade &amp; lubrication\u003c/div>\n\u003cdiv class=\"card\">\n  \u003cdiv class=\"grid-3\">\n    \u003cdiv class=\"field\">\n      \u003clabel>Bolt grade\u003c/label>\n      \u003cselect id=\"bolt_grade\" onchange=\"updateTorqueInfo()\">\n        \u003coption value=\"B7\">ASTM A193 B7 / B16\u003c/option>\n        \u003coption value=\"88\">ISO / DIN Grade 8.8\u003c/option>\n        \u003coption value=\"109\">ISO / DIN Grade 10.9\u003c/option>\n        \u003coption value=\"129\">ISO / DIN Grade 12.9\u003c/option>\n      \u003c/select>\n    \u003c/div>\n    \u003cdiv class=\"field\">\n      \u003clabel>Lubrication (friction coefficient \u03bc)\u003c/label>\n      \u003cselect id=\"lubrication\" onchange=\"updateTorqueInfo()\">\n        \u003coption value=\"0.10\">\u03bc = 0.10 \u2014 Lubricated (Molykote / moly paste)\u003c/option>\n        \u003coption value=\"0.15\" selected>\u03bc = 0.15 \u2014 Semi-lubricated (copper grease)\u003c/option>\n        \u003coption value=\"0.20\">\u03bc = 0.20 \u2014 Dry / no lubrication\u003c/option>\n      \u003c/select>\n    \u003c/div>\n    \u003cdiv class=\"field\">\n      \u003clabel>T :2563}},\n  M110: {af:155, '8.8':{t10:48511,t15:65837,t20:83162,kn:3150},'10.9':{t10:null,t15:null,t20:null,kn:null},'12.9':{t10:null,t15:null,t20:null,kn:null},'B7':{t10:null,t15:null,t20:null,kn:null}},\n};\n\n/* \u2550\u2550 HELPERS \u2550\u2550 */\nfunction afToAc(af) { return Math.ceil(af * 1.1547); }\nfunction setVal(id, v) { const el=document.getElementById(id); if(el) el.value = (v!=null?v:''); }\nfunction getNum(id) { return parseFloat(document.getElementById(id).value) || 0; }\n\n/* \u2550\u2550 REFERENCE PANEL \u2550\u2550 */\nfunction toggleRef() {\n  const body = document.getElementById('refBody');\n  const chev = document.getElementById('refChevron');\n  body.classList.toggle('open');\n  chev.classList.toggle('open');\n}\n\n/* \u2550\u2550 TAB SWITCH \u2550\u2550 */\nlet activeTab = 'std';\nfunction switchTab(t) {\n  activeTab = t;\n  document.querySelectorAll('.tab').forEach((el,i) => el.classList.toggle('active', (i===0&&t==='std')||(i===1&&t==='nonstd')));\n  document.getElementById('tab-std').classList.toggle('active', t==='std');\n  document.getElementById('tab-nonstd').classList.toggle('active', t==='nonstd');\n}\n\n/* \u2550\u2550 POPULATE STANDARD SIZE / CLASS DROPDOWNS \u2550\u2550 */\nfunction buildDropdowns() {\n  const std = document.getElementById('flange_std').value;\n  const tbl = std === 'API' ? API_TABLE : ASME_TABLE;\n  const sizes = Object.keys(tbl);\n  const szEl = document.getElementById('flange_size');\n  const prevSz = szEl.value;\n  szEl.innerHTML = sizes.map(s => `\u003coption${s===prevSz?' selected':''}>${s}\u003c/option>`).join('');\n  if (!sizes.includes(prevSz)) szEl.value = sizes[0];\n\n  const sz = szEl.value;\n  const classes = Object.keys(tbl[sz] || {});\n  const clEl = document.getElementById('flange_class');\n  const prevCl = clEl.value;\n  clEl.innerHTML = classes.map(c => `\u003coption${c===prevCl?' selected':''}>${c}\u003c/option>`).join('');\n  if (!classes.includes(prevCl)) clEl.value = classes[0];\n}\n\nfunction populateFlange() {\n  buildDropdowns();\n  const std = document.getElementById('flange_std').value;\n  const sz  = document.getElementById('flange_size').value;\n  const cls = document.getElementById('flange_class').value;\n  const tbl = std === 'API' ? API_TABLE : ASME_TABLE;\n  const row = tbl[sz]?.[cls];\n  if (!row || !row.pcd) { setVal('s_pcd',''); setVal('s_nbolts',''); setVal('s_b2b',''); setVal('s_bsize',''); return; }\n  const b2b = +(2*(row.pcd/2)*Math.sin(Math.PI/row.n)).toFixed(1);\n  setVal('s_pcd',   row.pcd.toFixed(1));\n  setVal('s_nbolts',row.n);\n  setVal('s_b2b',   b2b);\n  setVal('s_bsize', row.bsz);\n  /* Auto-fill pipe OD from catalogue */\n  if (row.pipeOD) setVal('s_pipe_od', row.pipeOD);\n  /* Sync bolt size selector */\n  if (row.bsz) {\n    const bsEl = document.getElementById('bolt_size');\n    const opt = [...bsEl.options].find(o => o.value === row.bsz);\n    if (opt) { bsEl.value = row.bsz; autoBoltDims(); }\n  }\n}\n\nfunction calcStdB2Body() {\n  /* just updates the hint visibility */\n  const v = getNum('s_pipe_od');\n  document.getElementById('pipe_od_hint').style.display = v ? 'none' : 'block';\n}\n\n/* \u2550\u2550 NON-STD AUTO-CALC \u2550\u2550 */\nfunction autoCalcNonStd() {\n  const pcd    = getNum('ns_pcd');\n  const nbolts = getNum('ns_nbolts');\n  const pipeOD = getNum('ns_pipe_od');\n  if (pcd && nbolts) {\n    const b2b = +(2*(pcd/2)*Math.sin(Math.PI/nbolts)).toFixed(1);\n    setVal('ns_b2b', b2b);\n  }\n  if (pcd && pipeOD) {\n    const b2body = +((pcd - pipeOD) / 2).toFixed(1);\n    setVal('ns_b2body', b2body);\n  }\n}\n\n/* \u2550\u2550 BOLT / NUT DIM AUTO-FILL \u2550\u2550 */\nfunction autoBoltDims() {\n  const sz = document.getElementById('bolt_size').value;\n  const d  = NUT_DIM[sz];\n  if (!d) return;\n  setVal('nut_af', d.af);\n  setVal('nut_ac', afToAc(d.af));\n  setVal('nut_h',  d.h);\n  updateTorqueInfo();\n  autoCalcNonStd();\n}\n\nfunction onAfChange() {\n  const af = getNum('nut_af');\n  if (af) setVal('nut_ac', afToAc(af));\n}\n\n/* \u2550\u2550 TORQUE INFO \u2550\u2550 */\nfunction updateTorqueInfo() {\n  const sz    = document.getElementById('bolt_size').value;\n  const grade = document.getElementById('bolt_grade').value;\n  const lube  = document.getElementById('lubrication').value;\n  const tEl   = document.getElementById('torque_info');\n  const row   = TORQUE_DB[sz];\n  const gk    = grade==='88' ? '8.8' : grade==='109' ? '10.9' : grade==='129' ? '12.9' : 'B7';\n  if (!row || !row[gk]) { tEl.innerHTML = '\u003cem style=\"color:var(--muted)\">No torque data for this grade/size\u003c/em>'; return; }\n  const g  = row[gk];\n  const mk = lube==='0.10' ? 't10' : lube==='0.15' ? 't15' : 't20';\n  const torq = g[mk], tens = g.kn;\n  tEl.innerHTML = torq\n    ? `Torque: \u003cstrong style=\"color:var(--text)\">${torq.toLocaleString()} Nm\u003c/strong> &nbsp;|&nbsp; Tension: \u003cstrong style=\"color:var(--text)\">${tens ? tens+' kN' : '\u2014'}\u003c/strong> \u003cspan style=\"color:var(--muted);font-size:10px\">(\u03bc=${lube})\u003c/span>`\n    : `\u003cem style=\"color:var(--amber)\">Torque not tabulated for this grade/size combination\u003c/em>`;\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n   MAIN CHECK \u2014 implements the 3 catalogue rules\n   \n   Rule 1: bolt-to-pipe distance > A/2\n     bolt_to_pipe = (PCD - pipeOD) / 2\n     Required: bolt_to_pipe > A/2\n   \n   Rule 2: Nut Height + Stud Protrusion + Clearance_over_stud > D + 12.75 mm\n     (stack height check)\n   \n   Rule 3: C-to-C >= B (inner bore) \u2014 tool bore must not foul adjacent bolt\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nfunction runCheck() {\n  let pcd, nbolts, b2b, b2body;\n\n  if (activeTab === 'std') {\n    pcd    = getNum('s_pcd');\n    nbolts = getNum('s_nbolts');\n    b2b    = getNum('s_b2b');\n    const pipeOD = getNum('s_pipe_od');\n    b2body = (pcd && pipeOD) ? (pcd - pipeOD) / 2 : 0;\n  } else {\n    pcd    = getNum('ns_pcd');\n    nbolts = getNum('ns_nbolts');\n    b2b    = getNum('ns_b2b')    || (pcd && nbolts ? +(2*(pcd/2)*Math.sin(Math.PI/nbolts)).toFixed(1) : 0);\n    b2body = getNum('ns_b2body') || (pcd && getNum('ns_pipe_od') ? (pcd - getNum('ns_pipe_od')) / 2 : 0);\n  }\n\n  const nut_ac    = getNum('nut_ac')        || afToAc(getNum('nut_af'));\n  const nut_h     = getNum('nut_h');\n  const stud_prot = getNum('stud_prot');\n  const clr_over  = getNum('clr_over_stud') || 99999;\n  const bolt_sz   = document.getElementById('bolt_size').value;\n\n  const vMsg = document.getElementById('validation_msg');\n  const pcdField    = document.getElementById(activeTab === 'std' ? 's_pcd' : 'ns_pcd');\n  const nboltsField = document.getElementById(activeTab === 'std' ? 's_nbolts' : 'ns_nbolts');\n  [pcdField, nboltsField].forEach(el => el.classList.remove('input-error'));\n  if (!pcd || !nbolts) {\n    if (!pcd) pcdField.classList.add('input-error');\n    if (!nbolts) nboltsField.classList.add('input-error');\n    vMsg.textContent = activeTab === 'std'\n      ? '\u26a0 Please select a flange size and pressure class so PCD and bolt count can be auto-filled.'\n      : '\u26a0 Please enter PCD and number of bolts \u2014 both are required to run the check.';\n    vMsg.style.display = 'block';\n    vMsg.scrollIntoView({behavior:'smooth', block:'center'});\n    return;\n  }\n  vMsg.style.display = 'none';\n  if (!b2b) b2b = +(2*(pcd/2)*Math.sin(Math.PI/nbolts)).toFixed(1);\n\n  const results = BTL_DB.map(btl => {\n    const checks = [];\n\n    /* \u2500\u2500 RULE 1: bolt-to-pipe clearance > A/2 \u2500\u2500 */\n    if (b2body > 0) {\n      const required = btl.A / 2;\n      const margin   = b2body - required;\n      checks.push({\n        label: 'Rule 1 \u2014 Bolt-to-pipe clearance vs A/2',\n        desc:  'Distance from bolt centre to pipe OD must exceed half the tool OD (A/2). Ensures tool body does not foul the pipe barrel.',\n        required: `${b2body.toFixed(1)} mm (bolt-to-pipe)`,\n        btl_val:  `A/2 = ${(btl.A/2).toFixed(1)} mm`,\n        margin, pass: margin >= 0,\n        warn: margin >= 0 && margin \u003c 8\n      });\n    }\n\n    /* \u2500\u2500 RULE 2: stack height \u2014 Nut H + Stud Protrusion + Clearance-over-stud > D + 12.75 mm \u2500\u2500 */\n    /* If no clearance is entered (open / unobstructed), Rule 2 passes automatically */\n    if (stud_prot > 0) {\n      if (clr_over \u003c 99999) {\n        const stack    = nut_h + stud_prot + clr_over;\n        const required = btl.D + 12.75;\n        const margin   = stack - required;\n        const stackDesc = `Nut H (${nut_h}) + Stud prot. (${stud_prot}) + Clearance (${clr_over}) = ${stack.toFixed(1)} mm`;\n        checks.push({\n          label: 'Rule 2 \u2014 Stack height vs D + 12.75 mm',\n          desc:  'Sum of Nut Height + Stud Protrusion + Clearance over stud must exceed Bridge Height D + 12.75 mm. Ensures operating room for the bridge and nut rotator.',\n          required: stackDesc,\n          btl_val:  `D + 12.75 = ${(btl.D + 12.75).toFixed(2)} mm`,\n          margin, pass: margin >= 0,\n          warn: margin >= 0 && margin \u003c 10\n        });\n      } else {\n        /* No obstruction specified \u2014 Rule 2 is clear (open overhead) */\n        checks.push({\n          label: 'Rule 2 \u2014 Stack height vs D + 12.75 mm',\n          desc:  'No obstruction clearance entered \u2014 overhead is open. Rule 2 passes automatically.',\n          required: 'Open / unobstructed',\n          btl_val:  `D + 12.75 = ${(btl.D + 12.75).toFixed(2)} mm`,\n          margin: 9999,\n          pass: true,\n          warn: false\n        });\n      }\n    }\n\n    /* \u2500\u2500 RULE 3: Centre-to-centre between two bolts >= B (inner bore) \u2500\u2500 */\n    const margin_b2b = b2b - btl.B;\n    checks.push({\n      label: 'Rule 3 \u2014 Bolt C-to-C \u2265 B (inner bore diameter)',\n      desc:  'The centre-to-centre distance between two adjacent bolts must be \u2265 the tool inner bore B. The tool bore must fit over the stud and clear the neighbouring bolt shank.',\n      required: `${b2b.toFixed(1)} mm (C-to-C)`,\n      btl_val:  `B = ${btl.B} mm`,\n      margin: margin_b2b,\n      pass: margin_b2b >= 0,\n      warn: margin_b2b >= 0 && margin_b2b \u003c 5\n    });\n\n    const boltOk  = btl.bolts.includes(bolt_sz);\n    const allPass = checks.every(c => c.pass) && boltOk;\n    const anyFail = checks.some(c => !c.pass) || !boltOk;\n    const anyWarn = checks.some(c => c.warn);\n\n    return { btl, checks, allPass, anyFail, anyWarn, boltOk };\n  });\n\n  /* Best model: bolt-compatible + all pass, prefer smallest */\n  const boltComp = results.filter(r => r.boltOk);\n  const passing  = boltComp.filter(r => r.allPass);\n  const best     = passing.length ? passing[0] : (boltComp.length ? boltComp[0] : results[0]);\n\n  /* Render */\n  document.getElementById('res_model').textContent = best.btl.model;\n  document.getElementById('res_bolts').textContent = `${best.btl.bolt_range} \u00b7 ${best.btl.cylinder_kN} kN \u00b7 ${best.btl.weight_kg} kg`;\n\n  const vEl = document.getElementById('res_verdict');\n  vEl.className = 'verdict-badge';\n  if (best.allPass && !best.anyWarn) { vEl.textContent = '\u2713 FULL FIT';         vEl.classList.add('pass'); }\n  else if (best.allPass)              { vEl.textContent = '\u26a0 FIT WITH CAUTION'; vEl.classList.add('warn'); }\n  else                                { vEl.textContent = '\u2717 DOES NOT FIT';     vEl.classList.add('fail'); }\n\n  /* Check rows */\n  const tbody = document.getElementById('check_rows');\n  tbody.innerHTML = best.checks.map(c => {\n    const st = !c.pass ? 'fail' : c.warn ? 'warn' : 'pass';\n    const lbl = !c.pass ? 'FAIL' : c.warn ? 'MARGINAL' : 'PASS';\n    const sign = c.margin >= 0 ? '+' : '';\n    return `\u003ctr>\n      \u003ctd>\u003cdiv class=\"param\">${c.label}\u003c/div>\u003cdiv class=\"sub\">${c.desc}\u003c/div>\u003c/td>\n      \u003ctd class=\"vals\">${c.required}\u003c/td>\n      \u003ctd class=\"vals\">${c.btl_val}\u003c/td>\n      \u003ctd class=\"margin\" style=\"color:${!c.pass?'var(--red)':c.warn?'var(--amber)':'var(--green)'}\">${sign}${Math.round(c.margin)} mm\u003c/td>\n      \u003ctd>\u003cspan class=\"status-pill ${st}\">${lbl}\u003c/span>\u003c/td>\n    \u003c/tr>`;\n  }).join('');\n  tbody.innerHTML += `\u003ctr>\n    \u003ctd>\u003cdiv class=\"param\">Bolt size compatibility\u003c/div>\u003cdiv class=\"sub\">Selected bolt size must match BTL bolt range\u003c/div>\u003c/td>\n    \u003ctd class=\"vals\">${bolt_sz}\u003c/td>\n    \u003ctd class=\"vals\">${best.btl.bolt_range}\u003c/td>\n    \u003ctd class=\"margin\" style=\"color:${best.boltOk?'var(--green)':'var(--red)'}\">\u2014\u003c/td>\n    \u003ctd>\u003cspan class=\"status-pill ${best.boltOk?'pass':'fail'}\">${best.boltOk?'COMPATIBLE':'INCOMPATIBLE'}\u003c/span>\u003c/td>\n  \u003c/tr>`;\n\n  /* All models grid */\n  document.getElementById('model_grid').innerHTML = results.map(r => {\n    const cls = r.anyFail ? 'bad' : r.anyWarn ? 'partial' : 'best';\n    const badge = r.anyFail ? '\u2717 No fit' : r.anyWarn ? '\u26a0 Marginal' : '\u2713 Fits';\n    const bc = r.anyFail ? 'var(--red)' : r.anyWarn ? 'var(--amber)' : 'var(--green)';\n    return `\u003cdiv class=\"model-card ${cls}\">\n      \u003cdiv class=\"mc-name\">${r.btl.model}\u003c/div>\n      \u003cdiv class=\"mc-bolt\">${r.btl.bolt_range}\u003c/div>\n      \u003cdiv class=\"mc-badge\" style=\"color:${bc}\">${badge}\u003c/div>\n      \u003cdiv style=\"font-size:10px;color:var(--muted);margin-top:3px\">${r.btl.cylinder_kN} kN \u00b7 ${r.btl.weight_kg} kg\u003c/div>\n    \u003c/div>`;\n  }).join('');\n\n  /* Specs */\n  const specs = [\n    {l:'Cylinder force', v:`${best.btl.cylinder_kN} kN`},\n    {l:'Hyd. area',      v:`${best.btl.area_cm2} cm\u00b2`},\n    {l:'A \u2014 bridge OD',  v:`${best.btl.A} mm`},\n    {l:'B \u2014 inner bore', v:`${best.btl.B} mm`},\n    {l:'C \u2014 height',     v:`${best.btl.C} mm`},\n    {l:'D \u2014 bridge ht',  v:`${best.btl.D} mm`},\n    {l:'E \u2014 puller eng', v:`${best.btl.E} mm`},\n    {l:'F \u2014 stud range', v:`${best.btl.F_min}\u2013${best.btl.F_max} mm`},\n    {l:'Weight',         v:`${best.btl.weight_kg} kg`},\n    {l:'Bolt range',     v:best.btl.bolt_range},\n  ];\n  document.getElementById('spec_row').innerHTML = specs.map(s => `\u003cdiv class=\"spec-item\">\u003cdiv class=\"sl\">${s.l}\u003c/div>\u003cdiv class=\"sv\">${s.v}\u003c/div>\u003c/div>`).join('');\n\n  /* Notes */\n  let notes = '';\n  if (best.allPass && !best.anyWarn) notes += `\u003cdiv class=\"note-box pass\" style=\"margin-top:12px\">\u2713 \u003cstrong>${best.btl.model}\u003c/strong> fits this flange without interference. All catalogue fitment rules are satisfied with positive margins.\u003c/div>`;\n  if (best.anyWarn) notes += `\u003cdiv class=\"note-box warn\" style=\"margin-top:12px\">\u26a0 One or more margins are tight. Verify actual site clearances before mobilisation. Half-population tensioning may be considered if adjacent tools are marginal.\u003c/div>`;\n  if (best.anyFail) notes += `\u003cdiv class=\"note-box fail\" style=\"margin-top:12px\">\u2717 The closest compatible model has one or more failing checks. Consult Tritorc engineering for a custom bridge configuration or alternative model. Verify stud protrusion is set correctly per ASME PCC-1 guidelines.\u003c/div>`;\n  if (!best.boltOk) notes += `\u003cdiv class=\"note-box warn\" style=\"margin-top:8px\">\u26a0 Bolt size \u003cstrong>${bolt_sz}\u003c/strong> is outside the standard range for \u003cstrong>${best.btl.model}\u003c/strong>. A custom bridge or adjacent model may be required.\u003c/div>`;\n  document.getElementById('result_notes').innerHTML = notes;\n\n  document.getElementById('results').style.display = 'block';\n  document.getElementById('results').scrollIntoView({behavior:'smooth', block:'start'});\n}\n\n/* \u2550\u2550 INIT \u2550\u2550 */\n(function() {\n  /* Embed BTL reference image */\n  document.getElementById('btlRefImg').src = 'data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAMCAgMCAgMDAwMEAwMEBQgFBQQEBQoHBwYIDAoMDAsKCwsNDhIQDQ4RDgsLEBYQERMUFRUVDA8XGBYUGBIUFRT/2wBDAQMEBAUEBQkFBQkUDQsNFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBT/wAARCAhiBZsDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD9GtW+K9joPwZu/iTqek6vpum2fh9/EV1pF3bLFqUESWxuHgeJnAWdVBUoWwGBBPevAtI/4KH2Wv6XZ6npfwA+O2pabewpc2t3aeDFlhnhdQySI63BDKykEMOCCMetewftYDH7LPxkI6/8IZrPP/bjNR+yeAf2WPg3nn/ijNG/9IYaAPK/+G+v+rcv2gP/AAhv/t9H/DfX/VuX7QH/AIQ3/wBvr6qooA+Vf+G+v+rcv2gP/CG/+30f8N9f9W5ftAf+EN/9vr6qooA+Vf8Ahvr/AKty/aA/8Ib/AO30f8N9f9W5ftAf+EN/9vr6qooA+Vf+G+v+rcv2gP8Awhv/ALfR/wAN9f8AVuX7QH/hDf8A2+vqqigD5V/4b6/6ty/aA/8ACG/+30f8N9f9W5ftAf8AhDf/AG+vqqigD5V/4b6/6ty/aA/8Ib/7fR/w31/1bl+0B/4Q3/2+vqqigD5V/wCG+v8Aq3L9oD/whv8A7fR/w31/1bl+0B/4Q3/2+vqqigD5V/4b6/6ty/aA/wDCG/8At9H/AA31/wBW5ftAf+EN/wDb6+qqKAPlX/hvr/q3L9oD/wAIb/7fR/w31/1bl+0B/wCEN/8Ab6+qqKAPlX/hvr/q3L9oD/whv/t9H/DfX/VuX7QH/hDf/b6+qqKAPlX/AIb6/wCrcv2gP/CG/wDt9H/DfX/VuX7QH/hDf/b6+qqKAPlX/h
