\",\"SLT3-3 (M33)\",\"SLT3-4 (M36)\",\"SLT3-5 (M24)\",\"SLT3-6 (M27)\",\"SLT3-7 (M33)\",\"SLT3-8 (M36)\",\"SLT3-9 (M36)\"]},\n  \"SLT4\":  {area_cm2:44.01, area_in2:6.821, max_kN:660,  stud_range:'M36 \u2013 M42 / 1\u00bc\" \u2013 1\u215d\"', A_mm:118, B_mm:130, C_mm:90,  D_mm:197, weight_kg:5.4,\n             variants:[\"SLT4-1 (M36)\",\"SLT4-2 (M36)\",\"SLT4-3 (M36)\",\"SLT4-4 (M42)\",\"SLT4-5 (M36)\",\"SLT4-6 (M36)\",\"SLT4-7 (M42)\",\"SLT4-8 (M42)\"]},\n  \"SLT5\":  {area_cm2:67.20, area_in2:10.416, max_kN:1008, stud_range:'M42 \u2013 M48 / 1\u00bd\" \u2013 2\"',  A_mm:140.5,B_mm:139, C_mm:114, D_mm:225, weight_kg:8.4,\n             variants:[\"SLT5-1 (M42)\",\"SLT5-2 (M42)\",\"SLT5-3 (M45)\",\"SLT5-4 (M48)\",\"SLT5-5 (M48)\",\"SLT5-6 (M42)\",\"SLT5-7 (M42)\",\"SLT5-8 (M45)\",\"SLT5-9 (M48)\"]},\n  \"SLT6\":  {area_cm2:100.35, area_in2:15.551, max_kN:1506, stud_range:'M52 \u2013 M68 / 2\u215b\" \u2013 2\u00be\"', A_mm:175.5,B_mm:161, C_mm:138, D_mm:259, weight_kg:13.8,\n             variants:[\"SLT6-1 (M52)\",\"SLT6-2 (M56)\",\"SLT6-3 (M60)\",\"SLT6-4 (M64)\",\"SLT6-5 (M68)\",\"SLT6-6 (M60)\",\"SLT6-7 (M64)\",\"SLT6-8 (M68)\"]},\n  \"SLT7\":  {area_cm2:166.66, area_in2:25.833, max_kN:2500, stud_range:'M72 \u2013 M90 / 2\u00be\" \u2013 3\u00bd\"', A_mm:219,  B_mm:180, C_mm:158, D_mm:310, weight_kg:23.0,\n             variants:[\"SLT7-1 (M72)\",\"SLT7-2 (M80)\",\"SLT7-3 (M80)\",\"SLT7-4 (M90)\",\"SLT7-5 (M76)\",\"SLT7-6 (M80)\",\"SLT7-7 (M80)\",\"SLT7-8 (M90)\",\"SLT7-9 (M90)\"]},\n  \"SLT8\":  {area_cm2:213.347, area_in2:33.068, max_kN:3202, stud_range:'M90 \u2013 M100 / 3\u00bd\" \u2013 4\"', A_mm:252,  B_mm:186, C_mm:200, D_mm:346, weight_kg:32.0,\n             variants:[\"SLT8-1 (M90)\",\"SLT8-2 (M95)\",\"SLT8-3 (M100)\"]}\n};\n\n// Stud size \u2192 recommended SLT model\nconst SLT_AUTO = {\n  \"0.5\":\"SLT1\",\"0.625\":\"SLT1\",\"0.75\":\"SLT1\",\"0.875\":\"SLT1\",\"1\":\"SLT1\",\n  \"1.125\":\"SLT2\",\"1.25\":\"SLT2\",\"1.375\":\"SLT3\",\n  \"1.5\":\"SLT4\",\"1.625\":\"SLT4\",\"1.75\":\"SLT4\",\n  \"1.875\":\"SLT5\",\"2\":\"SLT5\",\n  \"2.25\":\"SLT6\",\"2.5\":\"SLT6\",\n  \"2.75\":\"SLT7\",\"3\":\"SLT7\",\n  \"3.5\":\"SLT8\"\n};\n\n\nconst LEGACY_SEQ = {\n  4:[[1,3,2,4]],8:[[1,5,3,7],[2,6,4,8]],\n  12:[[1,7,4,10],[2,8,5,11],[3,9,6,12]],\n  16:[[1,9,5,13],[3,11,7,15],[2,10,6,14],[4,12,8,16]],\n  20:[[1,11,6,16],[3,13,8,18],[5,15,10,20],[2,12,7,17],[4,14,9,19]],\n  24:[[1,13,7,19],[4,16,10,22],[2,14,8,20],[5,17,11,23],[3,15,9,21],[6,18,12,24]]\n};\n\nlet state = {\n  numTensioners:4,calculated:false,\n  pA:0,pB:0,pC:0,pD:0,F_lbs:0,F_kN:0,P_psi:0,\n  numBolts:16,studSize:\"1.125\",btlModel:\"BTL-5\",effArea:5.11,\n  tensionerSeries:\"BTL\"  // \"BTL\" or \"SLT\"\n};\n// ============================================================\n// INIT\n// ============================================================\nwindow.onload = function(){\n  buildRefTables();\n  onFlangeChange();\n  onStudChange();\n  onTensionPumpChange();\n  onTensionerInput();\n  updateLiveBoltLoad();\n  updateCovInfo(state.numTensioners||4,state.numBolts||16);\n  ['flangeCanvas0','flangeCanvasRight','flangeCanvas2'].forEach(id=>{\n    const c=document.getElementById(id);\n    if(c) drawFlange(c,16,4);\n  });\n};\n\n// ============================================================\n// TABS\n// ============================================================\nfunction showPage(p,el){\n  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));\n  document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));\n  document.getElementById('page-'+p).classList.add('active');\n  if(el) el.classList.add('active');\n  if(p==='sequence'&&state.calculated){\n    const c=document.getElementById('flangeCanvas2');\n    if(c) drawFlange(c,state.numBolts,state.numTensioners||4);\n  }\n}\n\n// ============================================================\n// FLANGE CHANGE \u2014 FIX: access B165[size] as object, not function\n// ============================================================\nfunction onFlangeChange(){\n  const size=document.getElementById('flange-size').value;\n  const cls=parseInt(document.getElementById('flange-class').value);\n  if(!size) return;\n\n  const flangeData=B165[size];  // plain object lookup \u2014 NOT a function call\n  if(!flangeData||!flangeData[cls]||!flangeData[cls].length){\n    document.getElementById('info-nb').textContent='N/A';\n    document.getElementById('info-bs').textContent='N/A';\n    return;\n  }\n  const [nb,bs]=flangeData[cls];\n  state.numBolts=nb;\n  document.getElementById('info-nb').textContent=nb;\n  document.getElementById('info-bs').textContent=fmtSz(bs)+'\"';\n\n  const sel=document.getElementById('stud-size');\n  for(let o of sel.options){if(o.value===bs){sel.value=bs;break;}}\n  onStudChange();\n  ['flangeCanvas0','flangeCanvasRight'].forEach(id=>{\n    const c=document.getElementById(id);\n    if(c) drawFlange(c,nb,state.coverage);\n  });\n}\n\n// ============================================================\n// STUD CHANGE\n// ============================================================\nfunction onStudChange(){\n  const sz=document.getElementById('stud-size').value;\n  const grade=document.getElementById('stud-grade').value;\n  const yieldPsi=YIELD[grade]||105000;\n  const tsa=TSA[sz];\n  document.getElementById('info-yield').textContent=fmt(yieldPsi)+' PSI';\n  document.getElementById('info-tsa').textContent=tsa?tsa.tensile.toFixed(3)+' in\u00b2':'N/A';\n  updateTensionerDisplay(sz);\n  updateLiveBoltLoad();\n}\n\n// Live preview of target bolt load in the Stud Details card \u2014 mirrors the\n// F_lbs formula used inside calculate(), but only depends on stud/load inputs.\nfunction updateLiveBoltLoad(){\n  const el=document.getElementById('live-bload-val');\n  if(!el) return;\n  const sz=document.getElementById('stud-size').value;\n  const grade=document.getElementById('stud-grade').value;\n  const loadPct=parseFloat(document.getElementById('load-pct').value)/100;\n  const tsa=TSA[sz];\n  const yieldPsi=YIELD[grade]||105000;\n  if(!tsa||isNaN(loadPct)||loadPct\u003c=0){el.textContent='\u2014';return;}\n  const F_lbs=loadPct*yieldPsi*tsa.tensile;\n  const F_kN=F_lbs/224.8089;\n  el.textContent=fmt(F_lbs)+' lbs ('+F_kN.toFixed(1)+' kN)';\n}\n\nfunction onSeriesChange(series){\n  state.tensionerSeries=series;\n  // Update button styles\n  const isBTL=series==='BTL';\n  document.getElementById('btn-btl').style.borderColor=isBTL?'var(--accent-cyan)':'var(--border)';\n  document.getElementById('btn-btl').style.background=isBTL?'rgba(0,200,224,.15)':'transparent';\n  document.getElementById('btn-btl').style.color=isBTL?'var(--accent-cyan)':'var(--text-muted)';\n  document.getElementById('btn-slt').style.borderColor=!isBTL?'var(--accent-yellow)':'var(--border)';\n  document.getElementById('btn-slt').style.background=!isBTL?'rgba(245,158,11,.15)':'transparent';\n  document.getElementById('btn-slt').style.color=!isBTL?'var(--accent-yellow)':'var(--text-muted)';\n  document.getElementById('series-desc').textContent=isBTL\n    ?'BTL Series \u2014 Standard hydraulic bolt tensioner \u00b7 Up to 1500 Bar'\n    :'SLT Series \u2014 Spring Return hydraulic bolt tensioner \u00b7 1500 Bar / 21755 PSI \u00b7 8\u201310mm piston stroke';\n  document.getElementById('slt-variants-row').style.display=isBTL?'none':'block';\n  document.getElementById('slt-maxkn-row').style.display=isBTL?'none':'flex';\n  document.getElementById('slt-dims-row').style.display=isBTL?'none':'flex';\n  const sz=document.getElementById('stud-size').value;\n  updateTensionerDisplay(sz);\n}\n\nfunction updateTensionerDisplay(sz){\n  const series=state.tensionerSeries||'BTL';\n  if(series==='BTL'){\n    const mk=BTL_AUTO[sz]||'BTL-5';\n    const md=BTL_MODELS[mk];\n    state.btlModel=mk; state.effArea=md?md.area_in2:5.11;\n    document.getElementById('tdisp').innerHTML=\n      `\u003cspan class=\"tm\">${mk}\u003c/span>\u003cspan class=\"ta2\">${state.effArea.toFixed(2)} in\u00b2 (${md?md.area_cm2.toFixed(1):0} cm\u00b2)\u003c/span>`;\n    document.getElementById('info-ea').textContent=state.effArea.toFixed(2)+' in\u00b2';\n  } else {\n    const mk=SLT_AUTO[sz]||'SLT3';\n    const md=SLT_MODELS[mk];\n    state.btlModel=mk; state.effArea=md?md.area_in2:4.651;\n    document.getElementById('tdisp').innerHTML=\n      `\u003cspan class=\"tm\" style=\"color:var(--accent-yellow)\">${mk}\u003c/span>\u003cspan class=\"ta2\">${state.effArea.toFixed(2)} in\u00b2 (${md?md.area_cm2.toFixed(1):0} cm\u00b2)\u003c/span>`;\n    document.getElementById('info-ea').textContent=state.effArea.toFixed(2)+' in\u00b2';\n    // Populate variant dropdown\n    const sel=document.getElementById('slt-variant');\n    sel.innerHTML=(md?md.variants:[]).map(v=>`\u003coption value=\"${v}\">${v}\u003c/option>`).join('');\n    // Show SLT-specific info\n    if(md){\n      document.getElementById('info-maxkn').textContent=md.max_kN.toLocaleString()+' kN ('+Math.round(md.max_kN*224.8).toLocaleString()+' lbf)';\n      document.getElementById('info-dims').textContent=`A:${md.A_mm} \u00b7 B:${md.B_mm} \u00b7 C:${md.C_mm} \u00b7 D:${md.D_mm} mm \u00b7 ${md.weight_kg} kg`;\n    }\n  }\n}\n\nfunction onSLTVariantChange(){\n  // variant is cosmetic only \u2014 area is per SLT model, not sub-variant\n}\n\nfunction onLoadChange(){\n  const v=parseFloat(document.getElementById('load-pct').value)||60;\n  document.getElementById('load-pct-label').textContent=v;\n  const p=Math.min(100,Math.max(0,v));\n  document.getElementById('load-bar').style.width=p+'%';\n  updateLiveBoltLoad();\n}\n\n// ============================================================\n// TENSIONER COUNT\n// ============================================================\nfunction onTensionerInput(){\n  const nt=Math.max(1,parseInt(document.getElementById('num-tensioners').value)||4);\n  state.numTensioners=nt;\n  updateCovInfo(nt,state.numBolts||16);\n}\n\nfunction updateCovInfo(nt,nb){\n  const passes=Math.ceil(nb/nt);\n  const pct=Math.round((nt/nb)*100);\n  const labels=Array.from({length:passes},(_,i)=>String.fromCharCode(65+i));\n  const groups=labels.map((_,i)=>{\n    const b=[];for(let j=i+1;j\u003c=nb;j+=passes)b.push(j);\n    return b.join(',');\n  });\n  document.getElementById('cov-info').innerHTML=\n    '\u003cspan style=\"color:var(--accent-cyan)\">'+nt+'\u003c/span> tensioners on '\n    +'\u003cspan style=\"color:var(--accent-yellow)\">'+nb+'\u003c/span> bolts = '\n    +'\u003cspan style=\"color:var(--accent-green)\">~'+pct+'% coverage\u003c/span> \u00b7 '\n    +'\u003cstrong>'+passes+' pass'+(passes>1?'es':'')\n    +' ('+labels.join(', ')+')\u003c/strong>\u003cbr>'\n    +'\u003cspan style=\"color:var(--text-muted)\">Groups: '+groups.join(' | ')+'\u003c/span>';\n}\n\n// ============================================================\n// TENSIONING PUMP DATA\n// ============================================================\nconst TENSION_PUMPS = {\n  \"TBP-150\":{\n    type:\"Pneumatic\",color:\"var(--accent-cyan)\",badge:\"PNEUMATIC\",\n    tagline:\"Air Operated \u00b7 Portable \u00b7 Double Speed\",\n    maxBar:1500,maxPsi:21750,\n    flow:\"0.6 LPM @ 1,500 Bar\",\n    drive:\"Air \u00b7 1\u20136 Bar (min. 1 Bar, max. 6 Bar)\",\n    specs:[\n      {l:\"Outlet Pressure (Max)\",v:\"1,500 Bar\",hi:true},\n      {l:\"Pressure Ratio\",       v:\"300:1\"},\n      {l:\"Flow @ 1,500 Bar\",     v:\"0.6 LPM\"},\n      {l:\"Connection Inlet\",     v:\"1/2 BSP Female\"},\n      {l:\"Connection Outlet\",    v:\"HF4 Female\"},\n      {l:\"Gauge\",                v:\"Dual 0\u20132,000 Bar / 0\u201329,000 PSI\"},\n      {l:\"Air Consumption\",      v:\"800 L/min (28 scfm)\"},\n      {l:\"Dimensions (L\u00d7W\u00d7H)\",   v:\"430 \u00d7 400 \u00d7 390 mm\"}\n    ]\n  },\n  \"BEL-8\":{\n    type:\"Electric\",color:\"var(--accent-yellow)\",badge:\"ELECTRIC\",\n    tagline:\"Electric Motor \u00b7 230V / 50Hz \u00b7 High Speed\",\n    maxBar:1500,maxPsi:21750,\n    flow:\"0.1 LPM @ 1,500 Bar \u00b7 4.8 LPM open flow\",\n    drive:\"230V / 50Hz \u00b7 1.5 kW \u00b7 9A\",\n    specs:[\n      {l:\"Nominal Pressure\",     v:\"0\u20131,500 Bar\",hi:true},\n      {l:\"Solenoid Voltage\",     v:\"230V AC\"},\n      {l:\"Motor Capacity\",       v:\"1.5 kW / 55 IP\"},\n      {l:\"Flow @ 1,500 Bar\",     v:\"0.1 LPM\"},\n      {l:\"Pump Open Flow\",       v:\"4.8 LPM\"},\n      {l:\"Oil\",                  v:\"ISO Servo 68 \u00b7 5.5 ltr\"},\n      {l:\"Ambient Temp\",         v:\"45\u00b0C max\"},\n      {l:\"Max Oil Temp\",         v:\"70\u00b0C\"},\n      {l:\"Weight (w/o oil)\",     v:\"~35 kg\"},\n      {l:\"Remote\",               v:\"Forward & reverse operation\"}\n    ]\n  }\n};\n\nfunction onTensionPumpChange(){\n  const m=document.getElementById('pump-model-t').value;\n  const p=TENSION_PUMPS[m];\n  if(!p) return;\n  // Left-col summary\n  document.getElementById('tp-type').textContent=p.type;\n  document.getElementById('tp-type').style.color=p.color;\n  document.getElementById('tp-maxp').textContent=p.maxBar.toLocaleString()+' Bar ('+p.maxPsi.toLocaleString()+' PSI)';\n  document.getElementById('tp-flow').textContent=p.flow;\n  document.getElementById('tp-drive').textContent=p.drive;\n  document.getElementById('tp-extras').innerHTML=p.specs.map(s=>'\u2022 '+s.l+': '+s.v).join('\u003cbr>');\n  // Right-col spec card\n  document.getElementById('pump-spec-dot').style.background=p.color;\n  document.getElementById('pump-spec-title').textContent='PUMP: '+m;\n  const badge=document.getElementById('pump-spec-badge');\n  badge.textContent=p.badge;\n  badge.style.background=p.badge==='PNEUMATIC'?'rgba(0,200,224,.15)':'rgba(245,158,11,.15)';\n  badge.style.color=p.color;\n  let body='\u003cdiv style=\"font-size:10px;color:var(--text-muted);margin-bottom:7px;font-style:italic\">'+p.tagline+'\u003c/div>';\n  p.specs.forEach(s=>{\n    body+='\u003cdiv style=\"display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border)\">'\n      +'\u003cspan style=\"color:var(--text-muted)\">'+s.l+'\u003c/span>'\n      +'\u003cspan style=\"color:'+(s.hi?'var(--accent-green)':'var(--text-primary)')+';font-weight:'+(s.hi?700:400)+'\">'+s.v+'\u003c/span>'\n      +'\u003c/div>';\n  });\n  document.getElementById('pump-spec-body').innerHTML=body;\n}\n\n// ============================================================\n// CALCULATE \u2014 MAIN LOGIC\n// ============================================================\nfunction calculate(){\n  const eb=document.getElementById('err-box');\n  eb.classList.remove('vis');\n\n  const size=document.getElementById('flange-size').value;\n  const cls=parseInt(document.getElementById('flange-class').value);\n  const studSz=document.getElementById('stud-size').value;\n  const grade=document.getElementById('stud-grade').value;\n  const loadPct=parseFloat(document.getElementById('load-pct').value)/100;\n  const customArea=parseFloat(document.getElementById('custom-area').value);\n  const numTensioners=Math.max(1,parseInt(document.getElementById('num-tensioners').value)||4);\n  state.numTensioners=numTensioners;\n\n  if(!size){showErr('Please select a flange size.');return;}\n  if(!studSz){showErr('Please select a stud size.');return;}\n  if(isNaN(loadPct)||loadPct\u003c=0||loadPct>1){showErr('Load % must be 10\u2013100.');return;}\n\n  const flangeData=B165[size];\n  const boltEntry=flangeData?flangeData[cls]:null;\n  const numBolts=(boltEntry&&boltEntry.length)?boltEntry[0]:state.numBolts;\n  state.numBolts=numBolts;\n\n  const tsaEntry=TSA[studSz];\n  if(!tsaEntry){showErr('No TSA data for stud size '+studSz+'\".');return;}\n  const tsaVal=tsaEntry.tensile;\n  const yieldPsi=YIELD[grade]||105000;\n\n  let effArea=state.effArea;\n  if(!isNaN(customArea)&&customArea>0) effArea=customArea;\n  if(effArea\u003c=0){showErr('Invalid effective hydraulic area.');return;}\n\n  // === CORE FORMULAS ===\n  const F_lbs=loadPct*yieldPsi*tsaVal;\n  const F_kN=F_lbs/224.8089;\n  const P_psi=F_lbs/effArea;\n\n  // Number of passes = ceil(total bolts / tensioners available)\n  const passes=Math.ceil(numBolts/numTensioners);\n\n  // Build pressure array \u2014 last pass = working pressure P_psi\n  // Each earlier pass is higher to compensate for elastic interaction loss\n  // Escalation: ~15% step per prior pass (BTL/ASME PCC-1 multi-pass guidance)\n  let pressures=new Array(passes);\n  pressures[passes-1]=P_psi;\n  if(passes===1){\n    // 100% coverage \u2014 single pass\n  } else if(passes===2){\n    pressures[0]=P_psi*1.20;               // +20% for 2-pass\n  } else if(passes===3){\n    pressures[0]=P_psi*1.40;               // +40% first\n    pressures[1]=P_psi*1.15;               // +15% second\n  } else if(passes===4){\n    pressures[0]=P_psi*1.60;               // standard 25% method\n    pressures[1]=P_psi*1.35;\n    pressures[2]=P_psi*1.15;\n  } else {\n    // 5+ passes: linear ramp from (1 + passes*0.12) down to 1.0\n    const topMult=1+(passes-1)*0.12;\n    for(let i=0;i\u003cpasses-1;i++){\n      pressures[i]=P_psi*(topMult-(i*(topMult-1)/(passes-1)));\n    }\n  }\n  const passLabels=pressures.map((_,i)=>String.fromCharCode(65+i));\n  const pWorking=pressures[passes-1];\n\n  // Legacy compat\n  const pA=pressures[0],pB=pressures[1]||pWorking,\n        pC=pressures[2]||pWorking,pD=pressures[3]||pWorking;\n\n  Object.assign(state,{calculated:true,pressures,passLabels,passes,numTensioners,\n    pA,pB,pC,pD,pWorking,F_lbs,F_kN,P_psi,\n    studSz,effArea,grade,loadPct:loadPct*100,tsaVal,yieldPsi,cls,size,btlModelUsed:state.btlModel});\n\n  document.getElementById('res-placeholder').style.display='none';\n  document.getElementById('res-panel').style.display='block';\n  renderResults();\n  renderRounds();\n  renderProcedure();\n  renderPressureSummary();\n  renderSeqDetail();\n  ['flangeCanvas','flangeCanvasRight','flangeCanvas2'].forEach(id=>{\n    const cv=document.getElementById(id);\n    if(cv) drawFlange(cv,numBolts,numTensioners);\n  });\n  const pct=Math.round((numTensioners/numBolts)*100);\n  document.getElementById('bpinfo').textContent=\n    numBolts+' bolts \u00b7 '+numTensioners+' tensioners (~'+pct+'%) \u00b7 '+passes+' pass'+(passes>1?'es':'');\n}\n\nfunction showErr(msg){\n  const eb=document.getElementById('err-box');\n  eb.textContent='\u26a0 '+msg; eb.classList.add('vis');\n}\n\n// ============================================================\n// RENDER HELPERS\n// ============================================================\nfunction renderResults(){\n  const s=state;\n  document.getElementById('r-Flbs').textContent=fmt(s.F_lbs)+' lbs';\n  document.getElementById('r-FkN').textContent=s.F_kN.toFixed(1)+' kN';\n  document.getElementById('r-grade').textContent=s.grade+' \u00b7 '+fmt(s.yieldPsi)+' PSI';\n  document.getElementById('r-tsa').textContent=s.tsaVal.toFixed(3)+' in\u00b2';\n  document.getElementById('r-working').textContent=fmt(s.pWorking)+' PSI ('+fmtBar(s.pWorking)+')';\n  const seriesLabel = (state.tensionerSeries||'BTL')==='SLT' ? ' (SLT Spring Return)' : ' (BTL Standard)';\n  document.getElementById('r-tensioner').textContent=s.btlModelUsed+seriesLabel+' \u00b7 '+s.effArea.toFixed(2)+' in\u00b2';\n  document.getElementById('r-lbar').style.width=Math.min(100,s.loadPct)+'%';\n}\n\nfunction renderRounds(){\n  const rounds=[\n    {l:'SNUG',p:'20-30%',d:'Hand tight + wrench'},\n    {l:'RND 1',p:'20-30%',d:'Cross pattern'},\n    {l:'RND 2',p:'50-70%',d:'Cross pattern'},\n    {l:'RND 3',p:'100%',d:'Full target load'},\n    {l:'RND 4',p:'Check',d:'Circular, no rotation'},\n    {l:'RND 5',p:'Opt.',d:'4h later recheck'}\n  ];\n  document.getElementById('rounds-grid').innerHTML=rounds.map(r=>\n    `\u003cdiv class=\"rnd-box\">\u003cdiv class=\"rnd-lbl\">${r.l}\u003c/div>\u003cdiv class=\"rnd-pct\">${r.p}\u003c/div>\u003cdiv class=\"rnd-desc\">${r.d}\u003c/div>\u003c/div>`\n  ).join('');\n}\n\nfunction renderProcedure(){\n  const {pressures,passLabels,passes,numTensioners,numBolts}=state;\n  const COLS=['#ff4d6a','#f5c842','#26e07a','#00c8e0','#a78bfa','#f97316','#ec4899','#84cc16'];\n  let html='';\n  for(let i=0;i\u003cpasses;i++){\n    const col=COLS[i%COLS.length];\n    const bpos=[];for(let j=i+1;j\u003c=numBolts;j+=passes)bpos.push(j);\n    const bshow=bpos.length>5?bpos.slice(0,5).join(', ')+'\u2026':bpos.join(', ');\n    html+='\u003cdiv class=\"proc-step\" style=\"display:flex;gap:10px;border-left:3px solid '\n      +col+';background:var(--card-bg);border-radius:6px;padding:9px 12px;margin-bottom:7px;\">'\n      +'\u003cdiv style=\"min-width:22px;height:22px;border-radius:50%;background:'+col\n      +';display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#000;flex-shrink:0\">'\n      +(i+1)+'\u003c/div>'\n      +'\u003cdiv>\u003cdiv style=\"font-size:13px;font-weight:700;color:'+col+'\">Pass '+passLabels[i]\n      +' \u2014 '+Math.round(pressures[i]).toLocaleString()+' PSI ('+fmtBar(pressures[i])+')\u003c/div>'\n      +'\u003cdiv style=\"font-size:11px;color:var(--text-muted);margin-top:3px\">'\n      +'Install \u003cstrong style=\"color:var(--text-primary)\">'+numTensioners+'\u003c/strong> tensioner'+(numTensioners>1?'s':'')\n      +' equally spaced \u00b7 Bolts this pass: \u003cspan style=\"color:'+col+'\">'+bshow+'\u003c/span>\u003cbr>'\n      +'Pressurize to target \u00b7 Hold 10 s \u00b7 Lock nuts \u00b7 Release \u00b7 Advance to next group'\n      +'\u003c/div>\u003c/div>\u003c/div>';\n  }\n  html+='\u003cdiv style=\"display:flex;gap:10px;border-left:3px solid var(--text-muted);background:var(--card-bg);'\n    +'border-radius:6px;padding:9px 12px;\">'\n    +'\u003cdiv style=\"min-width:22px;height:22px;border-radius:50%;background:var(--text-muted);'\n    +'display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0\">\u2713\u003c/div>'\n    +'\u003cdiv>\u003cdiv style=\"font-size:13px;font-weight:700;color:var(--text-primary)\">Check Pass \u2014 '\n    +Math.round(pressures[passes-1]).toLocaleString()+' PSI ('+fmtBar(pressures[passes-1])+')\u003c/div>'\n    +'\u003cdiv style=\"font-size:11px;color:var(--text-muted);margin-top:3px\">'\n    +'Go around flange sequentially. Stop when no nut rotates on any bolt.\u003c/div>\u003c/div>\u003c/div>';\n  document.getElementById('proc-body').innerHTML=html;\n}\n\nfunction renderPressureSummary(){\n  const {pressures,passLabels}=state;\n  const maxP=Math.max(...pressures);\n  const COLS=['#ff4d6a','#f5c842','#26e07a','#00c8e0','#a78bfa','#f97316','#ec4899','#84cc16'];\n  let html='';\n  pressures.forEach((p,i)=>{\n    const col=COLS[i%COLS.length];\n    const isLast=i===pressures.length-1;\n    html+='\u003cdiv style=\"background:var(--input-bg);border:1px solid var(--border);border-left:3px solid '\n      +col+';border-radius:7px;margin-bottom:7px;overflow:hidden\">'\n      +'\u003cdiv style=\"padding:6px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)\">'\n        +'\u003cdiv style=\"font-family:Rajdhani,sans-serif;font-size:14px;font-weight:700;letter-spacing:1px;color:'+col+'\">Pass '+passLabels[i]+'\u003c/div>'\n        +'\u003cdiv style=\"font-size:9px;font-family:monospace;padding:2px 6px;border-radius:3px;background:'+col+'22;color:'+col+'\">'\n          +(isLast?'WORKING / CHECK':ordinal(i+1).toUpperCase()+' PASS')+'\u003c/div>'\n      +'\u003c/div>'\n      +'\u003cdiv style=\"padding:8px 10px\">'\n        +'\u003cdiv style=\"font-family:monospace;font-size:18px;font-weight:600;color:'+col+'\">'\n          +fmt(p)+' \u003cspan style=\"font-size:11px;color:var(--text-muted)\">PSI\u003c/span>\u003c/div>'\n        +'\u003cdiv style=\"width:100%;height:3px;border-radius:2px;background:var(--border);margin:4px 0\">'\n          +'\u003cdiv style=\"height:100%;border-radius:2px;width:'+((p/maxP)*100).toFixed(1)+'%;background:'+col+'\">\u003c/div>\u003c/div>'\n        +'\u003cdiv style=\"font-size:10px;color:var(--text-muted);font-family:monospace\">'\n          +fmtBar(p)+' \u00b7 '+(p/1000).toFixed(2)+' kPSI\u003c/div>'\n      +'\u003c/div>\u003c/div>';\n  });\n  document.getElementById('psum').innerHTML=html;\n}\n\nfunction ordinal(n){return n===1?'1st':n===2?'2nd':n===3?'3rd':n+'th';}\n\nfunction renderSeqDetail(){\n  const {pressures,passLabels,passes,numBolts}=state;\n  const COLS=['#ff4d6a','#f5c842','#26e07a','#00c8e0','#a78bfa','#f97316','#ec4899','#84cc16'];\n  let html='\u003ctable class=\"seq-table\">\u003cthead>\u003ctr>'\n    +'\u003cth>Pass\u003c/th>\u003cth>PSI\u003c/th>\u003cth>Bar\u003c/th>\u003cth>Bolt Numbers (this pass)\u003c/th>'\n    +'\u003c/tr>\u003c/thead>\u003ctbody>';\n  for(let i=0;i\u003cpasses;i++){\n    const col=COLS[i%COLS.length];\n    const bpos=[];for(let j=i+1;j\u003c=numBolts;j+=passes)bpos.push(j);\n    html+='\u003ctr style=\"border-left:3px solid '+col+'\">'\n      +'\u003ctd>\u003cstrong style=\"color:'+col+'\">Pass '+passLabels[i]+'\u003c/strong>\u003c/td>'\n      +'\u003ctd style=\"font-family:monospace\">'+fmt(pressures[i])+'\u003c/td>'\n      +'\u003ctd style=\"font-family:monospace\">'+fmtBar(pressures[i])+'\u003c/td>'\n      +'\u003ctd style=\"color:var(--text-muted);font-size:11px\">'+bpos.join(', ')+'\u003c/td>\u003c/tr>';\n  }\n  html+='\u003ctr style=\"border-left:3px solid var(--text-muted)\">'\n    +'\u003ctd>\u003cstrong>Check\u003c/strong>\u003c/td>'\n    +'\u003ctd style=\"font-family:monospace\">'+fmt(pressures[passes-1])+'\u003c/td>'\n    +'\u003ctd style=\"font-family:monospace\">'+fmtBar(pressures[passes-1])+'\u003c/td>'\n    +'\u003ctd style=\"color:var(--text-muted)\">Circular \u2014 all bolts\u003c/td>'\n    +'\u003c/tr>\u003c/tbody>\u003c/table>';\n\n  document.getElementById('seq-legend').innerHTML=\n    passLabels.map((lbl,i)=>'\u003cdiv style=\"display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted)\">'\n      +'\u003cdiv style=\"width:11px;height:11px;border-radius:50%;background:'+COLS[i%COLS.length]+'\">\u003c/div>'\n      +'Pass '+lbl+'\u003c/div>').join('');\n  document.getElementById('seq-detail').innerHTML=html;\n}\n\n// ============================================================\n// CANVAS\n// ============================================================\nfunction drawFlange(canvas,numBolts,coverage){\n  if(!canvas||!numBolts) return;\n  const ctx=canvas.getContext('2d');\n  const W=canvas.width,H=canvas.height,cx=W/2,cy=H/2;\n  const R=W*0.42,bR=W*0.055,bcR=R-bR*1.15,pipeR=R*0.38;\n  const light=true;\n\n  ctx.clearRect(0,0,W,H);\n\n  // Grid background\n  ctx.strokeStyle=light?'rgba(0,0,0,0.05)':'rgba(255,255,255,0.04)';\n  ctx.lineWidth=1;\n  const step=W/10;\n  for(let x=0;x\u003c=W;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}\n  for(let y=0;y\u003c=H;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}\n\n  // Flange body\n  const g=ctx.createRadialGradient(cx,cy,pipeR,cx,cy,R);\n  g.addColorStop(0,'#e2e6ee');g.addColorStop(1,'#9aa3b5');\n  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();\n  ctx.strokeStyle='#8891a5';ctx.lineWidth=2;ctx.stroke();\n\n  // Bore\n  const pg=ctx.createRadialGradient(cx,cy,0,cx,cy,pipeR);\n  pg.addColorStop(0,'#8e97a8');pg.addColorStop(1,'#6b7488');\n  ctx.beginPath();ctx.arc(cx,cy,pipeR,0,Math.PI*2);ctx.fillStyle=pg;ctx.fill();\n  ctx.strokeStyle='#5c6478';ctx.lineWidth=1.5;ctx.stroke();\n\n  // Crosshairs\n  ctx.strokeStyle=light?'rgba(0,0,0,0.1)':'rgba(255,255,255,0.06)';\n  ctx.lineWidth=1;ctx.setLineDash([4,4]);\n  ctx.beginPath();ctx.moveTo(cx-R,cy);ctx.lineTo(cx+R,cy);ctx.stroke();\n  ctx.beginPath();ctx.moveTo(cx,cy-R);ctx.lineTo(cx,cy+R);ctx.stroke();\n  ctx.setLineDash([]);\n\n  const numT=(typeof coverage==='number'&&coverage\u003c10)?coverage:state.numTensioners||4;\n  const passes=Math.ceil(numBolts/numT);\n  const passColors=['#ff4d6a','#f5c842','#26e07a','#00c8e0','#a78bfa','#f97316','#ec4899','#84cc16'];\n\n  for(let i=0;i\u003cnumBolts;i++){\n    const angle=(i/numBolts)*Math.PI*2-Math.PI/2;\n    const bx=cx+bcR*Math.cos(angle),by=cy+bcR*Math.sin(angle);\n    const color=passColors[i%passes]||passColors[0];\n\n    ctx.shadowColor=color;ctx.shadowBlur=8;\n    ctx.beginPath();ctx.arc(bx,by,bR,0,Math.PI*2);\n    ctx.fillStyle=color+'22';ctx.fill();ctx.shadowBlur=0;\n\n    ctx.beginPath();ctx.arc(bx,by,bR,0,Math.PI*2);\n    ctx.fillStyle='#ffffff';ctx.fill();\n    ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();\n\n    ctx.fillStyle='#1a2235';\n    ctx.font=`bold ${Math.max(8,Math.floor(bR*0.85))}px 'Share Tech Mono',monospace`;\n    ctx.textAlign='center';ctx.textBaseline='middle';\n    ctx.fillText(i+1,bx,by);\n  }\n}\n\n// ============================================================\n// REFERENCE TABLES\n// ============================================================\nfunction buildRefTables(){\n  // BTL\n  let h=`\u003ctr>\u003cth>Model\u003c/th>\u003cth>cm\u00b2\u003c/th>\u003cth>in\u00b2\u003c/th>\u003cth>Max kN\u003c/th>\u003cth>Stud Range\u003c/th>\u003c/tr>`;\n  for(const[m,d] of Object.entries(BTL_MODELS))\n    h+=`\u003ctr>\u003ctd style=\"color:var(--accent-cyan);font-weight:700\">${m}\u003c/td>\n      \u003ctd>${d.area_cm2.toFixed(1)}\u003c/td>\u003ctd>${d.area_in2.toFixed(2)}\u003c/td>\n      \u003ctd>${d.cylinder_kN.toFixed(0)}\u003c/td>\u003ctd>${d.stud_range}\u003c/td>\u003c/tr>`;\n  document.getElementById('ref-btl').innerHTML=h;\n\n  // SLT\n  h=`\u003ctr>\u003cth>Model\u003c/th>\u003cth>cm\u00b2\u003c/th>\u003cth>in\u00b2\u003c/th>\u003cth>Max kN\u003c/th>\u003cth>A mm\u003c/th>\u003cth>B mm\u003c/th>\u003cth>C mm\u003c/th>\u003cth>D mm\u003c/th>\u003cth>kg\u003c/th>\u003cth>Stud Range\u003c/th>\u003c/tr>`;\n  for(const[m,d] of Object.entries(SLT_MODELS))\n    h+=`\u003ctr>\u003ctd style=\"color:var(--accent-yellow);font-weight:700\">${m}\u003c/td>\n      \u003ctd>${d.area_cm2.toFixed(2)}\u003c/td>\u003ctd>${d.area_in2.toFixed(3)}\u003c/td>\n      \u003ctd>${d.max_kN.toLocaleString()}\u003c/td>\n      \u003ctd>${d.A_mm}\u003c/td>\u003ctd>${d.B_mm}\u003c/td>\u003ctd>${d.C_mm}\u003c/td>\u003ctd>${d.D_mm}\u003c/td>\n      \u003ctd>${d.weight_kg}\u003c/td>\u003ctd>${d.stud_range}\u003c/td>\u003c/tr>`;\n  document.getElementById('ref-slt').innerHTML=h;\n\n  // TSA\n  h=`\u003ctr>\u003cth>Size\u003c/th>\u003cth>TPI\u003c/th>\u003cth>Root in\u00b2\u003c/th>\u003cth>Tensile in\u00b2\u003c/th>\u003c/tr>`;\n  for(const[sz,d] of Object.entries(TSA))\n    h+=`\u003ctr>\u003ctd style=\"color:var(--accent-orange)\">${fmtSz(sz)}\"\u003c/td>\n      \u003ctd>${d.tpi}\u003c/td>\u003ctd>${d.root}\u003c/td>\u003ctd>${d.tensile}\u003c/td>\u003c/tr>`;\n  document.getElementById('ref-tsa').innerHTML=h;\n\n  // Yield\n  h=`\u003ctr>\u003cth>Grade\u003c/th>\u003cth>Yield PSI\u003c/th>\u003cth>MPa\u003c/th>\u003c/tr>`;\n  for(const[g,y] of Object.entries(YIELD))\n    h+=`\u003ctr>\u003ctd style=\"color:var(--accent-green)\">${g.replace('_',' Cl.')}\u003c/td>\n      \u003ctd>${fmt(y)}\u003c/td>\u003ctd>${Math.round(y/145)}\u003c/td>\u003c/tr>`;\n  document.getElementById('ref-yield').innerHTML=h;\n\n  // B16.5 sample\n  const sizes=['4','6','8','10','12','14','16'],cls=[150,300,600,900,1500];\n  h=`\u003ctr>\u003cth>NPS\u003c/th>${cls.map(c=>`\u003cth>${c}#\u003c/th>`).join('')}\u003c/tr>`;\n  for(const sz of sizes){\n    h+=`\u003ctr>\u003ctd style=\"color:var(--accent-yellow)\">${sz}\"\u003c/td>`;\n    for(const c of cls){\n      const d=B165[sz]?.[c];\n      h+=`\u003ctd>${d&&d.length?d[0]+'\u00d7'+fmtSz(d[1])+'\"':'N/A'}\u003c/td>`;\n    }\n    h+='\u003c/tr>';\n  }\n  document.getElementById('ref-b165').innerHTML=h;\n}\n\n// ============================================================\n// RESET\n// ============================================================\nfunction resetAll(){\n  document.getElementById('flange-size').value='12';\n  document.getElementById('flange-class').value='300';\n  document.getElementById('stud-size').value='1.125';\n  document.getElementById('stud-grade').value='B7';\n  document.getElementById('load-pct').value='60';\n  document.getElementById('custom-area').value='';\n  document.getElementById('err-box').classList.remove('vis');\n  state.numTensioners=4;\n  state.tensionerSeries='BTL';\n  onSeriesChange('BTL');\n  document.getElementById('num-tensioners').value=4;\n  onLoadChange();onFlangeChange();onStudChange();\n  onTensionerInput();\n  state.calculated=false;\n  document.getElementById('res-placeholder').style.display='block';\n  document.getElementById('res-panel').style.display='none';\n  drawFlange(document.getElementById('flangeCanvas0'),16,4);\n  drawFlange(document.getElementById('flangeCanvasRight'),16,4);\n}\n\n// ============================================================\n// FORMATTERS\n// ============================================================\nfunction fmt(n){return isNaN(n)?'\u2014':Math.round(n).toLocaleString();}\nfunction fmtBar(psi){return(psi/14.5038).toFixed(1)+' bar';}\nfunction fmtSz(v){\n  const f={'0.5':'\u00bd','0.625':'\u215d','0.75':'\u00be','0.875':'\u215e','1.125':'1\u215b','1.25':'1\u00bc',\n    '1.375':'1\u215c','1.5':'1\u00bd','1.625':'1\u215d','1.75':'1\u00be','1.875':'1\u215e','2.25':'2\u00bc',\n    '2.5':'2\u00bd','2.75':'2\u00be','3.5':'3\u00bd'};\n  return f[v]||v;\n}\n\u003c/script>\n\u003cscript>\n(function(){\n  var MAP = {\"tritork_btl_fitment_checker_r3.html\": \"fitment\", \"tritorc_btl_fitment_checker_r3.html\": \"fitment\", \"tritorc_bolt_torquing_calculator.html\": \"torque\", \"bolt_tensioning_calculator.html\": \"tension\"};\n  document.addEventListener('click', function(e){\n    var a = e.target.closest && e.target.closest('a[href]');\n    if (!a) return;\n    var name = (a.getAttribute('href') || '').split(/[?#]/)[0].split(/[\\\\/]/).pop().toLowerCase();\n    var view = MAP[name];\n    if (!view) return;\n    e.preventDefault();\n    parent.postMessage({ tritorcView: view }, '*');\n  }, true);\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n" }
};
var DEFAULT_VIEW = "fitment";
var frames = {};

function viewFromHash() {
  var v = (location.hash || "").replace("#", "");
  return PAGES[v] ? v : DEFAULT_VIEW;
}

function show(view) {
  if (!PAGES[view]) view = DEFAULT_VIEW;
  if (!frames[view]) {
    var f = document.createElement("iframe");
    f.className = "calc";
    f.title = PAGES[view].title;
    document.body.appendChild(f);
    f.srcdoc = PAGES[view].html;
    frames[view] = f;
  }
  for (var k in frames) frames[k].classList.toggle("active", k === view);
  document.title = PAGES[view].title;
}

function go(view) {
  if (!PAGES[view]) return;
  if (viewFromHash() === view && location.hash) { show(view); return; }
  location.hash = view;
}

window.addEventListener("hashchange", function () { show(viewFromHash()); });
window.addEventListener("message", function (e) {
  var known = false;
  for (var k in frames) if (frames[k].contentWindow === e.source) known = true;
  if (known && e.data && typeof e.data.tritorcView === "string") go(e.data.tritorcView);
});
show(viewFromHash());
</script>
